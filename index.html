let B=null;
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);

function startStage(n,d){
  const s=STAGES.find(x=>x.n===n), D=CFG.diff[d];
  let pool=s.q.filter(q=>D.need.includes(q.lv)); if(!pool.length)pool=s.q;
  B={mode:"stage",stage:n,diff:d,hideMode:D.hide,canHeal:false,canUlt:false,
     me:{hp:CFG.playerHP,max:CFG.playerHP,nm:myName(),face:$("avatar").textContent,shield:false,streak:0},
     foe:{hp:D.hp,max:D.hp,nm:s.mon.nm,face:s.mon.ar,dmg:D.foe,shield:false,acc:D.acc},
     pool,queue:shuffle(pool.slice()),time:D.time,round:0,correct:0,total:0};
  renderBattle();
}
function tierRange(t){
  const lo=Math.max(0,t-CFG.tierGap), hi=Math.min(TIERS.length-2,t+CFG.tierGap);
  return {lo:TIERS[lo].lo, hi: hi>=6 ? 999999 : TIERS[hi].hi};
}
async function eligibleFoes(myT){
  const r=tierRange(myT);
  try{
    const raw=await DAL.foesInRange(r.lo,r.hi);
    const list=raw.map(x=>({k:x.k,nm:dispName(x.u,x.k),rp:x.u.rp||0,rk:rankOf(x.u.rp||0,null)}))
                  .filter(x=>Math.abs(x.rk.t-myT)<=CFG.tierGap);
    return {list, scanned:raw.length, error:null};
  }catch(e){ return {list:[], scanned:0, error:(e&&e.message)||String(e)} }
}

/* ================= คิวจับคู่ประลองสด ================= */
let MTICK=null, MSTOP=null;
const FLATQ = STAGES.flatMap(s=>s.q);            // คลังข้อสอบเรียงเหมือนกันทุกเครื่อง

async function startRanked(){
  const R=rankOf(U.rp,MYPOS);
  if(!LIVE.ready()) return searchMatch(R,null);   // โหมดออฟไลน์ ใช้บอทอย่างเดียว
  const r=tierRange(R.t);
  try{
    await LIVE.join({uname:ME,nm:myName(),rp:U.rp||0,t:R.t});
  }catch(e){
    console.error(e);
    return searchMatch(R,{list:[],scanned:0,error:"เข้าคิวไม่สำเร็จ: "+((e&&e.message)||e)});
  }
  searchMatch(R,null,r);
}

function searchMatch(R,first,range){
  let left=CFG.matchSeconds, waiting=0, err=first?first.error:null, closing=false;
  const lo=Math.max(0,R.t-CFG.tierGap), hi=Math.min(TIERS.length-1,R.t+CFG.tierGap);
  const span=TIERS.slice(lo,hi+1).map(x=>`<span style="color:${x.c}">${x.nm}</span>`).join(" · ");
  const paint=()=>{
    const t=$("mmT"); if(t)t.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;
    const d=$("mmInfo"); if(!d)return;
    d.innerHTML = err ? `<b style="color:var(--atk)">${err}</b>`
      : !LIVE.ready() ? `โหมดออฟไลน์ — ไม่มีการจับคู่สด จะสู้กับบอทเมื่อครบเวลา`
      : `กำลังรอประลองอยู่ตอนนี้ <b style="color:${waiting?"var(--hp)":"var(--gold)"}">${waiting}</b> คนในช่วงแรงค์นี้`
        + (waiting?"":`<br><span style="color:var(--gold)">ให้เพื่อนกดปุ่มเริ่มประลองพร้อมกัน แล้วจะจับคู่กันเอง</span>`);
  };
  $("viewBattle").innerHTML=`
    <div class="panel result">
      <div style="font-size:52px">🔍</div>
      <h2 style="margin:10px 0 6px">กำลังหาคู่ประลอง</h2>
      <p class="note">หาผู้เล่นในช่วงแรงค์ ${span}</p>
      <p class="dsp" style="font-size:34px;margin:14px 0" id="mmT">3:00</p>
      <p class="note" id="mmInfo"></p>
      <p class="note" style="margin-top:8px">ครบเวลาแล้วยังไม่เจอ จะจับคู่กับบอทแรงค์ ${R.nm} ให้อัตโนมัติ</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px">
        <button class="primary" onclick="skipSearch()">สู้กับบอทเลย</button>
        <button class="ghost" onclick="cancelSearch()">ยกเลิก</button>
      </div>
    </div>`;
  go("battle");paint();

  const tick=async()=>{
    if(closing)return;
    left--;paint();
    if(left<=0){closing=true;stopSearch();await LIVE.ready()&&LIVE.leave();return beginMatch(null,R)}
    if(!LIVE.ready())return;
    try{
      await LIVE.beat();
      const mine=await LIVE.mine();
      if(mine&&mine.match){                       // มีคนจับคู่เราไว้แล้ว
        closing=true;stopSearch();
        const m=await LIVE.getMatch(mine.match);
        await LIVE.leave();
        if(m) return beginLive(mine.match,m,R);
        return beginMatch(null,R);
      }
      const list=await LIVE.waiting(range.lo,range.hi);
      const ok=list.filter(x=>Math.abs(rankOf(x.rp,null).t-R.t)<=CFG.tierGap);
      waiting=ok.length;paint();
      // ใครชื่อผู้ใช้เรียงก่อน เป็นคนสร้างห้อง กันสร้างซ้อนกัน
      const partner=ok.find(x=>ME<x.k);
      if(partner){
        closing=true;stopSearch();
        const id=ME+"__"+partner.k+"__"+Date.now().toString(36);
        const qs=shuffle(FLATQ.map((_,i)=>i)).slice(0,40);
        const data={a:ME,b:partner.k,an:myName(),bn:partner.nm,
                    at:R.t,bt:rankOf(partner.rp,null).t,
                    arp:U.rp||0,brp:partner.rp||0,qs,start:Date.now()};
        await LIVE.createMatch(id,data);
        await LIVE.tagQueue(partner.k,id);
        await LIVE.leave();
        return beginLive(id,data,R);
      }
    }catch(e){ err="เชื่อมต่อคิวไม่สำเร็จ: "+((e&&e.message)||e); paint(); }
  };
  MTICK=setInterval(tick,1500);
}
function stopSearch(){clearInterval(MTICK);MTICK=null}
function cancelSearch(){stopSearch(); if(LIVE.ready())LIVE.leave(); go("pvp")}
function skipSearch(){stopSearch(); if(LIVE.ready())LIVE.leave(); beginMatch(null,rankOf(U.rp,MYPOS))}

/* ================= เริ่มการประลองสด ================= */
function beginLive(id,m,R){
  const side = (m.a===ME) ? "a" : "b";
  const myT  = side==="a" ? m.at : m.bt;
  const oT   = side==="a" ? m.bt : m.at;
  const oNm  = side==="a" ? m.bn : m.an;
  const oRp  = side==="a" ? (m.brp||0) : (m.arp||0);
  const myHp = pvpHp(myT), oHp = pvpHp(oT);
  B={mode:"ranked",live:true,mid:id,side,hideMode:"always",
     canHeal:myT>=CFG.healFromTier, canUlt:myT>=CFG.ultFromTier,
     me:{hp:myHp,max:myHp,nm:myName(),face:$("avatar").textContent,shield:false,streak:0},
     foe:{hp:oHp,max:oHp,nm:oNm,rp:oRp,rankName:TIERS[oT].nm,rankColor:TIERS[oT].c,face:"🧑‍💻",
          dmg:{atk:CFG.dmg.atk,pen:CFG.dmg.pen},shield:false,streak:0,
          canHeal:oT>=CFG.healFromTier, canUlt:oT>=CFG.ultFromTier},
     qs:m.qs, time:CFG.pvpTime, round:0, correct:0, total:0};
  MSTOP=LIVE.watchMatch(id,d=>{
    if(d&&d.quit&&d.quit!==side&&!B.ended){
      B.ended=true; B.foe.hp=0;
      $("log").innerHTML=`<b style="color:var(--hp)">${B.foe.nm} ออกจากการประลอง คุณชนะโดยปริยาย</b>`;
      setTimeout(finish,1200);
    }
  });
  renderBattle();
}
function liveCleanup(){ if(MSTOP){MSTOP();MSTOP=null} }

function beginMatch(opp,R){
  const myHp=pvpHp(R.t);
  const oT = opp? opp.rk.t : R.t;
  const oHp= pvpHp(oT);
  B={mode:"ranked",hideMode:"always",
     canHeal:R.t>=CFG.healFromTier, canUlt:R.t>=CFG.ultFromTier,
     me:{hp:myHp,max:myHp,nm:myName(),face:$("avatar").textContent,shield:false,streak:0},
     foe:{hp:oHp,max:oHp, rp: opp?(opp.rp||0):(U.rp||0),
          nm:opp?`${opp.nm} (เงา)`:`บอทฝึกซ้อม`,
          rankName:opp?opp.rk.full:R.full, rankColor:opp?opp.rk.c:R.c,
          face:opp?"🥷":"🤖",
          dmg:{atk:CFG.dmg.atk,pen:CFG.dmg.pen},shield:false,streak:0,
          acc:CFG.botAcc[oT],
          canHeal:oT>=CFG.healFromTier, canUlt:oT>=CFG.ultFromTier},
     pool:STAGES.flatMap(s=>s.q),queue:shuffle(STAGES.flatMap(s=>s.q)),
     time:CFG.pvpTime,round:0,correct:0,total:0};
  renderBattle();
}

function renderBattle(){
  $("viewBattle").innerHTML=`
    <div class="arena">
      <div class="fighter" id="fMe"><div class="face" id="faceMe">${B.me.face}</div>
        <div class="nm">${B.me.nm}</div>
        <div class="hpbar"><i id="hpMe"></i></div><div class="hpnum" id="nMe"></div></div>
      <div class="vs">VS</div>
      <div class="fighter" id="fFoe"><div class="face" id="faceFoe">${B.foe.face}</div>
        <div class="nm">${B.foe.nm}</div>
        ${B.foe.rankName?`<div class="hpnum" style="color:${B.foe.rankColor};margin-top:2px">${B.foe.rankName}</div>`:""}
        <div class="hpbar foe"><i id="hpFoe"></i></div><div class="hpnum" id="nFoe"></div></div>
    </div>
    <div class="intent" id="intent"></div>
    <div class="skillbar" id="skillbar"></div>
    <div class="moves" id="moves"></div>
    <div class="resultline" id="log"></div>
    <div class="panel qbox hide" id="qbox">
      <div class="qhead"><span id="qmeta"></span><span id="qtime"></span></div>
      <div class="timer"><i id="tbar" style="width:100%"></i></div>
      <div class="qtext" id="qtext"></div>
      <div class="opts" id="opts"></div>
    </div>`;
  go("battle");
  paintHP();nextRound();
}
function paintHP(){
  $("hpMe").style.width=Math.max(0,B.me.hp/B.me.max*100)+"%";
  $("hpFoe").style.width=Math.max(0,B.foe.hp/B.foe.max*100)+"%";
  $("nMe").textContent=Math.max(0,B.me.hp)+" / "+B.me.max+(B.me.shield?" 🛡️":"");
  $("nFoe").textContent=Math.max(0,B.foe.hp)+" / "+B.foe.max+(B.foe.shield?" 🛡️":"");
  $("fMe").classList.toggle("shieldon",B.me.shield);
  $("fFoe").classList.toggle("shieldon",B.foe.shield);
}
function moveTag(k){
  const col={atk:"var(--atk)",pen:"var(--pen)",def:"var(--def)",ult:"#B58CFF"}[k];
  return `<b style="color:${col}">${MOVES[k].ic} ${MOVES[k].nm}</b>`;
}
function isHidden(){
  if(B.hideMode==="always")return true;
  if(B.hideMode==="half")return B.foe.hp < B.foe.max/2;
  return false;
}
function drawSkills(){
  const sb=$("skillbar");
  if(!B.canHeal&&!B.canUlt){sb.innerHTML=`<span class="streak">ตอบถูกติดกัน ${B.me.streak} ข้อ</span>`;return}
  const need=B.canUlt?CFG.ultStreak:CFG.healStreak;
  let h=`<span class="streak">ตอบถูกติดกัน <b style="color:var(--gold)">${B.me.streak}</b> ข้อ</span>`;
  if(B.canHeal)h+=`<button class="healbtn" onclick="useHeal()" ${B.me.streak>=CFG.healStreak&&!B.picked?"":"disabled"}>💚 ฮีล +${CFG.heal} HP (${Math.min(B.me.streak,CFG.healStreak)}/${CFG.healStreak})</button>`;
  if(B.canUlt&&B.me.streak<CFG.ultStreak)h+=`<span class="streak">💥 อัลติเมทพร้อมที่ ${CFG.ultStreak} ข้อติด</span>`;
  sb.innerHTML=h;
}
function useHeal(){
  if(B.picked||B.me.streak<CFG.healStreak)return;
  const before=B.me.hp;
  B.me.hp=Math.min(B.me.max,B.me.hp+CFG.heal);
  B.me.streak=0;B.healedNow=true;
  $("log").innerHTML=`💚 ใช้สกิลฮีล ฟื้นพลังชีวิต ${B.me.hp-before} HP — สถิติตอบถูกติดกันเริ่มนับใหม่ ตอนนี้เลือกท่าได้ตามปกติ`;
  paintHP();drawSkills();
}
function nextRound(){
  clearInterval(TICK);
  if(B.me.hp<=0||B.foe.hp<=0) return finish();
  B.round++;B.picked=false;B.healedNow=false;
  B.foeHealed=0;
  if(B.live){
    B.foeMove=null;
    B.q=FLATQ[B.qs[(B.round-1)%B.qs.length]];
  }else{
    if(B.foe.canHeal&&B.foe.streak>=CFG.healStreak&&B.foe.hp<B.foe.max){
      const before=B.foe.hp;B.foe.hp=Math.min(B.foe.max,B.foe.hp+CFG.heal);
      B.foeHealed=B.foe.hp-before;B.foe.streak=0;
    }
    B.foeMove=(B.foe.canUlt&&B.foe.streak>=CFG.ultStreak)
      ? "ult" : ["atk","pen","def"][Math.floor(Math.random()*3)];
    if(!B.queue.length)B.queue=shuffle(B.pool.slice());
    B.q=B.queue.pop();
  }
  B.foeHidden=isHidden();
  $("qbox").classList.add("hide");
  $("intent").innerHTML = B.live
    ? `รอบที่ ${B.round} — ประลองสดกับ <b>${B.foe.nm}</b> · ท่าของอีกฝ่าย <b>🎴 ปิดไพ่ไว้</b>`
    : B.foeHidden
    ? `รอบที่ ${B.round} — ${B.foe.nm} เลือกท่าไว้แล้ว <b>🎴 ปิดไพ่ไว้</b> จะเปิดเมื่อตอบคำถามเสร็จ`
    : `รอบที่ ${B.round} — ${B.foe.nm} กำลังเตรียม ${moveTag(B.foeMove)}`;
  const showUlt=B.canUlt&&B.me.streak>=CFG.ultStreak;
  const keys=showUlt?["atk","pen","def","ult"]:["atk","pen","def"];
  const mv=$("moves");mv.className="moves"+(showUlt?" four":"");
  mv.innerHTML=keys.map(k=>`
    <button class="move ${MOVES[k].cls}" onclick="pick('${k}')">
      <span class="mi">${MOVES[k].ic}</span><span class="mn">${MOVES[k].nm}</span><span class="md">${MOVES[k].d}</span></button>`).join("");
  drawSkills();
  $("log").innerHTML=`เลือกท่าแล้วตอบให้ถูกและทันเวลา — <b>ท่าของฝ่ายไหนจะทำงาน ก็ต่อเมื่อฝ่ายนั้นตอบถูก</b>`;
  paintHP();
  if(B.mode==="ranked")startPickTimer(keys);
}
function startPickTimer(keys){
  let left=CFG.pickSeconds;
  const show=()=>{const el=$("picktime");if(el)el.textContent=left};
  $("intent").innerHTML+=` · เลือกท่าภายใน <b id="picktime" style="color:var(--gold)">${left}</b> วินาที`;
  TICK=setInterval(()=>{
    left--;show();
    if(left<=0){
      clearInterval(TICK);
      if(B.picked)return;
      const auto=keys[Math.floor(Math.random()*keys.length)];
      $("log").innerHTML=`⏱️ หมดเวลาเลือกท่า ระบบสุ่มท่าให้เป็น ${moveTag(auto)}`;
      pick(auto);
    }
  },1000);
}
function pick(mv){
  if(B.picked)return;
  clearInterval(TICK);
  B.myMove=mv;B.picked=true;
  document.querySelectorAll(".move").forEach(b=>b.disabled=true);
  document.querySelector(".move."+MOVES[mv].cls).classList.add("sel");
  drawSkills();
  askQuestion();
}
function askQuestion(){
  const q=B.q;B.total++;
  $("qbox").classList.remove("hide");
  $("qmeta").textContent=`ท่าที่เลือก: ${MOVES[B.myMove].nm}`;
  $("qtext").innerHTML=q.q;
  const order=shuffle(q.c.map((t,i)=>({t,i})));
  $("opts").innerHTML=order.map((o,k)=>`<button class="opt" data-i="${o.i}" onclick="answer(${o.i},this)">${"กขคง"[k]}. ${o.t}</button>`).join("");
  let left=B.time;$("qtime").textContent=left+" วิ";$("tbar").style.width="100%";
  TICK=setInterval(()=>{
    left--;$("qtime").textContent=Math.max(0,left)+" วิ";$("tbar").style.width=(left/B.time*100)+"%";
    if(left<=0){clearInterval(TICK);answer(-1,null)}
  },1000);
}
function answer(i,btn){
  clearInterval(TICK);
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.i===B.q.a)b.classList.add("right")});
  const meOK=(i===B.q.a);
  B.selfTimeout=(i<0);
  if(!meOK&&btn)btn.classList.add("wrong");
  if(B.live) return submitLive(meOK);
  resolveRound(meOK, Math.random()<B.foe.acc);
}
async function submitLive(meOK){
  let wait=CFG.pvpTime+12;
  const show=()=>{const el=$("log"); if(el)el.innerHTML=
    `ส่งคำตอบแล้ว กำลังรอ <b>${B.foe.nm}</b> ตอบ... <b style="color:var(--gold)">${wait}</b> วินาที`};
  show();
  const wt=setInterval(()=>{wait--;show();if(wait<=0)clearInterval(wt)},1000);
  let unsub=null, done=false;
  const other=B.side==="a"?"b":"a";
  const close=fp=>{
    if(done)return; done=true;
    clearInterval(wt);
    if(unsub)unsub(); clearTimeout(dl);
    B.foeMove = (fp&&fp.mv) ? fp.mv : "atk";
    B.foeHealed = (fp&&fp.heal) ? CFG.heal : 0;
    if(B.foeHealed){B.foe.hp=Math.min(B.foe.max,B.foe.hp+CFG.heal);B.foe.streak=0}
    resolveRound(meOK, !!(fp&&fp.ok), !fp);
  };
  const dl=setTimeout(()=>close(null),(CFG.pvpTime+12)*1000);
  try{
    await LIVE.submit(B.mid,B.round,B.side,{mv:B.myMove,ok:meOK,heal:B.healedNow?1:0});
    unsub=LIVE.watchRound(B.mid,B.round,d=>{ if(d&&d[other])close(d[other]) });
  }catch(e){ console.error(e); close(null) }
}
function resolveRound(meOK,foeOK,timedOut){
  try{ resolveInner(meOK,foeOK,timedOut) }
  catch(err){
    console.error("สรุปผลรอบไม่สำเร็จ:",err);
    $("log").innerHTML=`<b style="color:var(--atk)">เกิดข้อผิดพลาดในรอบนี้ ข้ามไปรอบถัดไป</b>`;
    paintHP();setTimeout(nextRound,1500);
  }
}
function resolveInner(meOK,foeOK,timedOut){
  if(meOK){B.correct++; B.myMove==="ult"?B.me.streak=0:B.me.streak++;} else B.me.streak=0;
  if(foeOK){B.foeMove==="ult"?B.foe.streak=0:B.foe.streak++;} else B.foe.streak=0;

  const lines=[];
  if(timedOut)lines.push(`⏱️ ${B.foe.nm} ตอบไม่ทันเวลา`);
  if(B.foeHealed)lines.push(`💚 ${B.foe.nm} ใช้สกิลฮีล ฟื้น ${B.foeHealed} HP`);
  lines.push(`${B.foeHidden?`${B.foe.nm} เปิดไพ่: `:``}${moveTag(B.foeMove)} · คุณเลือก ${moveTag(B.myMove)}`);
  lines.push(meOK?`<b style="color:var(--hp)">คุณตอบถูก</b> — ท่าของคุณทำงาน`
                 :`<b style="color:var(--atk)">${B.selfTimeout?"คุณหมดเวลา":"คุณตอบผิด"}</b> — ท่าของคุณไม่ทำงาน`);
  lines.push(foeOK?`${B.foe.nm} ตอบถูก — ท่าของอีกฝ่ายทำงาน`
                  :`${B.foe.nm} ตอบผิด — ท่าของอีกฝ่ายไม่ทำงาน`);

  // 1) ตั้งโล่ก่อน
  if(meOK&&B.myMove==="def"){B.me.shield=true;lines.push(`🛡️ คุณตั้งโล่ไว้ กันการโจมตีได้ 1 ครั้ง`)}
  if(foeOK&&B.foeMove==="def"){B.foe.shield=true;lines.push(`🛡️ ${B.foe.nm} ตั้งโล่ขึ้นมา`)}
  // 2) แล้วค่อยคิดการโจมตีของทั้งสองฝั่งพร้อมกัน
  if(meOK&&B.myMove!=="def"){
    if(B.myMove==="atk"){
      if(B.foe.shield){B.foe.shield=false;lines.push(`⚔️ โจมตีของคุณถูกโล่ของ ${B.foe.nm} กันไว้ โล่แตก`)}
      else{B.foe.hp-=CFG.dmg.atk;hit("faceFoe");lines.push(`⚔️ คุณโจมตีเข้าเป้า ${B.foe.nm} เสีย ${CFG.dmg.atk} HP`)}
    }else if(B.myMove==="pen"){
      B.foe.hp-=CFG.dmg.pen;hit("faceFoe");
      lines.push(`🗡️ เจาะเกราะเข้าเป้า ${B.foe.nm} เสีย ${CFG.dmg.pen} HP${B.foe.shield?" (ทะลุโล่)":""}`);
    }else{
      B.foe.hp-=CFG.dmg.ult;hit("faceFoe");
      lines.push(`💥 อัลติเมท! ${B.foe.nm} เสีย ${CFG.dmg.ult} HP ป้องกันไม่ได้`);
    }
  }
  if(foeOK&&B.foeMove!=="def"){
    if(B.foeMove==="atk"){
      if(B.me.shield){B.me.shield=false;lines.push(`⚔️ ${B.foe.nm} โจมตี แต่โล่ของคุณกันไว้ได้ โล่แตก`)}
      else{B.me.hp-=B.foe.dmg.atk;hit("faceMe");lines.push(`⚔️ ${B.foe.nm} โจมตีใส่ คุณเสีย ${B.foe.dmg.atk} HP`)}
    }else if(B.foeMove==="ult"){
      B.me.hp-=CFG.dmg.ult;hit("faceMe");
      lines.push(`💥 ${B.foe.nm} ปล่อยอัลติเมท! คุณเสีย ${CFG.dmg.ult} HP ป้องกันไม่ได้`);
    }else{
      B.me.hp-=B.foe.dmg.pen;hit("faceMe");
      lines.push(`🗡️ ${B.foe.nm} ใช้เจาะเกราะ คุณเสีย ${B.foe.dmg.pen} HP${B.me.shield?" (โล่กันเจาะเกราะไม่ได้)":""}`);
    }
  }
  if(!meOK&&!foeOK)lines.push(`ไม่มีใครทำอะไรได้ในรอบนี้`);

  paintHP();drawSkills();
  $("log").innerHTML=lines.join("<br>");
  setTimeout(nextRound,2400);
}
function hit(id){const e=$(id);e.classList.remove("shake");void e.offsetWidth;e.classList.add("shake")}

/* =======================================================================
   ส่วนที่ 9 : สรุปผลและรางวัล
   ======================================================================= */
async function finish(){
  liveCleanup();
  const draw = B.me.hp<=0 && B.foe.hp<=0;
  const won  = !draw && B.foe.hp<=0 && B.me.hp>0;
  let xp=0,first=false,rp=0,drawNote="",oldRank=rankOf(U.rp,MYPOS);
  if(B.mode==="stage"){
    const D=CFG.diff[B.diff];
    if(won){
      xp=D.xp;
      U.clear[B.stage]=U.clear[B.stage]||{};
      if(!U.clear[B.stage][B.diff]){U.clear[B.stage][B.diff]=true;xp+=D.first;first=true}
      const fk=B.stage+"-"+B.diff;
      if(!isAdmin()) await DAL.claimFirstClear(fk,myName());
      U.xp+=xp;U.wins++;
    }else{U.losses++;xp=Math.round(D.xp*.15);U.xp+=xp}
  }else{
    const myRp=U.rp||0, oRp=B.foe.rp||0;
    if(draw){
      const sameTier = rankOf(myRp,null).t === rankOf(oRp,null).t;
      if(sameTier){ rp=0; drawNote="เสมอกันในแรงค์เดียวกัน คะแนนไม่เปลี่ยนแปลงทั้งสองฝ่าย"; }
      else if(myRp>oRp){ rp=Math.round(loseRp(myRp)/2);
        drawNote=`เสมอกับผู้เล่นที่แรงค์ต่ำกว่า คุณเป็นฝ่ายคะแนนสูงกว่าจึงถูกหักครึ่งหนึ่งของการแพ้`; }
      else { rp=0; drawNote="เสมอกับผู้เล่นที่แรงค์สูงกว่า คุณเป็นฝ่ายคะแนนน้อยกว่าจึงไม่ถูกหักคะแนน"; }
      xp=35;
    }else{
      rp=won?winRp(myRp):loseRp(myRp);
      xp=won?60:15;
    }
    U.rp=Math.max(0,myRp+rp);
    U.xp+=xp;
    if(draw){U.pvpSD=(U.pvpSD||0)+1;U.pvpAD=(U.pvpAD||0)+1}
    else if(won){U.wins++;U.pvpSW=(U.pvpSW||0)+1;U.pvpAW=(U.pvpAW||0)+1}
    else {U.losses++;U.pvpSL=(U.pvpSL||0)+1;U.pvpAL=(U.pvpAL||0)+1}
  }
  U.plays++; await commit();
  if(B.mode==="ranked") await refreshPos();
  refreshTop();
  const newRank=rankOf(U.rp,MYPOS);
  const acc=B.total?Math.round(B.correct/B.total*100):0;
  const changed=B.mode==="ranked"&&newRank.full!==oldRank.full;
  $("viewBattle").innerHTML=`
    <div class="panel result">
      <div class="big ${draw?"":won?"win":"lose"}" ${draw?'style="color:var(--gold)"':""}>${draw?"เสมอ!":won?"ชนะ!":"พ่ายแพ้"}</div>
      <p class="note" style="margin-top:8px">${draw?`พลังชีวิตหมดพร้อมกันทั้งสองฝ่าย${drawNote?" — "+drawNote:""}`
        :won?`คุณเอาชนะ ${B.foe.nm} ได้สำเร็จ`:`${B.foe.nm} ยังแข็งแกร่งเกินไป กลับไปทบทวนใบความรู้แล้วลองใหม่`}</p>
      <div class="rewards">
        <div class="rw">ตอบถูก<b>${B.correct}/${B.total}</b>${acc}%</div>
        <div class="rw">ค่าประสบการณ์<b>+${xp}</b>${first?"รวมโบนัสชนะครั้งแรก":"XP"}</div>
        ${B.mode==="ranked"?`<div class="rw">คะแนนแรงค์<b style="color:${rp>=0?"var(--hp)":"var(--atk)"}">${rp>0?"+":""}${rp}</b>รวม ${U.rp}</div>`:""}
      </div>
      ${changed?`<p style="color:${newRank.c};font-weight:700;font-family:'Bai Jamjuree';font-size:19px">${oldRank.full} → ${newRank.full}</p>`:""}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px">
        ${B.mode==="stage"
          ?`<button class="primary" onclick="startStage(${B.stage},'${B.diff}')">ลองอีกครั้ง</button>
            <button onclick="openStage(${B.stage})">อ่านใบความรู้ซ้ำ</button>
            <button class="ghost" onclick="go('map')">กลับแผนที่</button>`
          :`<button class="primary" onclick="startRanked()">ประลองอีกครั้ง</button>
            <button class="ghost" onclick="go('pvp')">กลับสนามประลอง</button>`}
      </div>
    </div>`;
}

function rankTable(myRp){
  return `<table><tr><th>แรงค์</th><th>ช่วงคะแนน</th><th>เลือด</th><th>ชนะ / แพ้</th><th>บอท</th><th>สกิล</th></tr>
  ${TIERS.map((T,i)=>{
    const inIt = i===7 ? (myRp>=CFG.godMinRp) : (i===6 ? myRp>=3001 : (myRp>=T.lo&&myRp<=T.hi));
    const range = i===7 ? `${CFG.godMinRp}+ และติด ${CFG.godTop} อันดับแรก` : (T.hi?`${T.lo} – ${T.hi}`:`${T.lo} ขึ้นไป`);
    const sk=[i>=CFG.healFromTier?"💚 ฮีล":"", i>=CFG.ultFromTier?"💥 อัลติเมท":""].filter(Boolean).join(" ")||"—";
    const ref=T.lo;
    return `<tr class="${inIt?"me":""}"><td style="color:${T.c};font-weight:700">${T.nm}${i<=5?" 5→1":""}</td>
      <td>${range}</td><td>${pvpHp(i)}</td>
      <td><span style="color:var(--hp)">+${winRp(ref)}</span> / <span style="color:var(--atk)">${loseRp(ref)}</span></td>
      <td>${Math.round(CFG.botAcc[i]*100)}%</td>
      <td class="note">${sk}</td></tr>`;
  }).join("")}</table>
  <p class="note" style="margin-top:10px">คะแนนชนะ/แพ้ในตารางคิดจากคะแนนต่ำสุดของแรงค์นั้น ยิ่งสะสมคะแนนสูงขึ้นภายในแรงค์เดียวกัน ชนะก็จะได้น้อยลงและแพ้เสียมากขึ้นเรื่อย ๆ</p>`;
}

async function saveNick(){
  const el=$("nickIn"), m=$("nickMsg"); if(!el)return;
  const v=el.value.trim();
  m.classList.remove("ok");
  if(!canNick(U)) return m.textContent="ยังเปลี่ยนชื่อเล่นไม่ได้ในตอนนี้";
  if(v.length<2||v.length>16) return m.textContent="ชื่อเล่นต้องยาว 2–16 ตัวอักษร";
  if(v===U.nick) return m.textContent="ชื่อเล่นเหมือนเดิม ไม่มีอะไรเปลี่ยน";

  U.nick=v;U.nickAt=Date.now();await commit();refreshTop();
  await drawProfile();
  const m2=$("nickMsg"); m2.classList.add("ok");
  m2.textContent=`ตั้งชื่อเล่นเรียบร้อย ตอนนี้จะแสดงเป็น ${v} (${ME})`;
}
function togglePw(){PWOPEN=!PWOPEN;PWDONE=false;drawProfile()}
async function submitPw(){
  const o=$("pwOld").value, a=$("pwNew").value, b=$("pwNew2").value, m=$("pwMsg");
  m.classList.remove("ok");
  if(await sha(o)!==U.pw) return m.textContent="รหัสผ่านเดิมไม่ถูกต้อง";
  if(a.length<4) return m.textContent="รหัสผ่านใหม่ต้องยาวอย่างน้อย 4 ตัวอักษร";
  if(a!==b) return m.textContent="รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน";
  const nw=await sha(a);
  if(nw===U.pw) return m.textContent="รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม";
  U.pw=nw; await commit(); PWOPEN=false;PWDONE=true;drawProfile();
}
async function approveReset(k){
  const list=await DAL.listResets();
  const r=list.find(x=>x.k===k); if(!r)return;
  const u=await DAL.getUser(k); if(!u)return;
  u.pw=r.pw; await DAL.saveUser(k,u); await DAL.delReset(k);
  if(k===ME)U=u;
  drawAdmin();
}
async function rejectReset(k){await DAL.delReset(k);drawAdmin()}

      <button class="${expired?"primary":"ghost"}" onclick="adminNewSeason()">เริ่มฤดูกาลใหม่ (รีเซ็ตคะแนนแรงค์ทุกคนเป็น 0)</button>

      <label for="adminSearch">ค้นหาด้วยชื่อผู้ใช้ (พิมพ์ตัวขึ้นต้น เช่น m1-)</label>

async function adminNewSeason(){
  if(!confirm("ยืนยันเริ่มฤดูกาลใหม่? คะแนนแรงค์ของทุกคนจะถูกรีเซ็ตเป็น 0"))return;
  SEASON=await DAL.newSeason();
  refreshTop(); await drawAdmin();
}
async function adminSave(i){
  const e=ADMINLIST[i]; if(!e)return;
  const k=e.k,u=e.u;
  const nick=$("an"+i).value.trim();
  const real=$("ax"+i).value.trim().replace(/\s+/g," ");
  const rp=Math.max(0,Math.round(Number($("ar"+i).value)||0));
  const notes=[];
  if(real!==(u.real||"")){
    if(real.length>60){ADMINMSG[k]={text:"ชื่อ–สกุลยาวเกิน 60 ตัวอักษร"};return drawAdmin()}
    u.real=real;notes.push(real?`แก้ชื่อเป็น ${real}`:"ลบชื่อ–สกุลแล้ว");
  }
  if(nick!==(u.nick||"")){
    if(nick&&(nick.length<2||nick.length>16)){ADMINMSG[k]={text:"ชื่อเล่นต้องยาว 2–16 ตัวอักษร"};return drawAdmin()}
    u.nick=nick;notes.push(nick?`ตั้งชื่อเล่นเป็น ${nick}`:"ลบชื่อเล่นแล้ว");
  }
  if(rp!==(u.rp||0)){const before=u.rp||0;u.rp=rp;notes.push(`คะแนนแรงค์ ${before} → ${rp}`)}
  if(!notes.length){ADMINMSG[k]={text:"ไม่มีอะไรเปลี่ยนแปลง"};return drawAdmin()}
  await DAL.saveUser(k,u);
  if(k===ME){U=u;refreshTop()}
  ADMINMSG[k]={ok:true,text:"บันทึกแล้ว — "+notes.join(" · ")};
  await drawAdmin();
}
async function adminUnlockNick(i){
  const e=ADMINLIST[i]; if(!e)return;
  const k=e.k,u=e.u; u.nickAt=0;
  await DAL.saveUser(k,u);
  if(k===ME)U=u;
  ADMINMSG[k]={ok:true,text:"ปลดล็อกแล้ว นักเรียนคนนี้เปลี่ยนชื่อเล่นเองได้ทันที"};
  await drawAdmin();
}

                    :"💾 โหมดออฟไลน์ — ข้อมูลถูกเก็บไว้ในเครื่องนี้เท่านั้น";
  $("authView").querySelector(".authbox").appendChild(badge);
  setAuthMode("login");
  const sess=sessionStorage.getItem(SESS);

})();
