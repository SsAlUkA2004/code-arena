<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CODE ARENA — ว21103 วิทยาการคำนวณ ม.1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0E0720; --deep:#170C33; --panel:#20134A; --panel2:#2B1B60;
  --line:#3C2A7A; --ink:#EDE7FF; --dim:#A092C8;
  --atk:#FF4D6D; --pen:#FFC63F; --def:#3DD6C4;
  --gold:#F2C14E; --xp:#8B7BFF; --hp:#5BE39B; --danger:#FF6B6B;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, #3A1C6B 0%, transparent 62%),
    radial-gradient(900px 520px at 92% 6%, #12335E 0%, transparent 58%),
    var(--void);
  background-attachment:fixed;
  color:var(--ink);
  font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:16px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.dsp,button,.tag{font-family:'Bai Jamjuree','IBM Plex Sans Thai',sans-serif}
h1,h2,h3{line-height:1.25;font-weight:700;letter-spacing:.2px}
a{color:var(--gold)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 96px}
.hide{display:none !important}

/* ---------- ปุ่ม ---------- */
button{
  font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;
  background:var(--panel2);border:1px solid var(--line);border-radius:11px;
  padding:11px 18px;transition:transform .09s ease, filter .15s ease;
}
button:hover:not(:disabled){filter:brightness(1.18)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:linear-gradient(160deg,#6C4BD8,#4327A8);border-color:#8A6BFF}
.ghost{background:transparent}
.wide{width:100%}

/* ---------- การ์ด / แผง ---------- */
.panel{background:linear-gradient(170deg,var(--panel),var(--deep));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:#00000033;color:var(--dim)}

/* ---------- เข้าสู่ระบบ ---------- */
#authView{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.authbox{width:100%;max-width:430px}
.logo{font-size:clamp(38px,10vw,60px);font-weight:700;line-height:1;letter-spacing:-1px;
  background:linear-gradient(96deg,#FF4D6D 0%,#FFC63F 42%,#3DD6C4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:14px;margin-top:8px}
label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
input,select{
  width:100%;padding:12px 14px;border-radius:11px;border:1px solid var(--line);
  background:#0C0620;color:var(--ink);font-family:inherit;font-size:15px
}
input:focus,select:focus{outline:2px solid var(--xp);outline-offset:0;border-color:var(--xp)}
.msg{font-size:13.5px;margin-top:12px;color:var(--danger);min-height:20px}
.msg.ok{color:var(--hp)}
.switch{text-align:center;margin-top:16px;font-size:14px;color:var(--dim)}
.switch button{background:none;border:none;color:var(--gold);padding:4px;font-size:14px}

/* ---------- แถบบน ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.avatar{width:52px;height:52px;border-radius:13px;display:grid;place-items:center;font-size:26px;
  background:var(--panel2);border:1px solid var(--line);flex:none}
.who{flex:1;min-width:150px}
.who b{font-size:17px}
.who .sub{margin-top:2px}
.bar{height:7px;border-radius:99px;background:#0C0620;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),#C3B4FF)}
.rankchip{padding:7px 13px;border-radius:11px;font-weight:700;font-size:14px;font-family:'Bai Jamjuree',sans-serif;
  border:1px solid;background:#00000040}

/* ---------- เมนู ---------- */
nav{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap}
nav button{padding:9px 16px;font-size:14.5px;background:#00000030}
nav button.on{background:var(--panel2);border-color:#8A6BFF;color:#fff}

/* ---------- แผนที่ด่าน ---------- */
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.stage{position:relative;text-align:left;padding:14px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(165deg,var(--panel),var(--deep));cursor:pointer;font-family:inherit;color:inherit}
.stage:hover:not(.lock){border-color:#8A6BFF}
.stage.lock{opacity:.42;cursor:not-allowed}
.stage .no{font-size:11px;color:var(--dim);font-weight:600}
.stage .ic{font-size:30px;margin:4px 0 6px;display:block}
.stage .nm{font-size:14px;font-weight:600;line-height:1.35}
.stars{margin-top:9px;font-size:13px;letter-spacing:2px;color:#4A3A80}
.stars b{color:var(--gold);font-weight:400}

/* ---------- บทเรียน ---------- */
.lesson h3{margin-bottom:6px}
.lesson p{margin:12px 0;max-width:68ch}
.lesson ul{margin:12px 0 12px 22px}
.lesson li{margin:6px 0}
.keybox{border-left:3px solid var(--gold);background:#00000030;padding:12px 16px;border-radius:0 11px 11px 0;margin:16px 0}
.readbar{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--void),#0E0720dd);
  padding:10px 0 12px;margin-bottom:4px}
.readbar .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);margin-bottom:6px}
.readbar .track{height:8px;border-radius:99px;background:#0C0620;border:1px solid var(--line);overflow:hidden}
.readbar .track i{display:block;height:100%;background:linear-gradient(90deg,var(--xp),var(--def));transition:width .2s}
.checkq{padding:14px;border:1px solid var(--line);border-radius:12px;background:#00000030;margin-bottom:12px}
.checkq .qq{font-weight:600;font-size:15.5px;margin-bottom:10px;line-height:1.5}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:8px}
.diff{text-align:left;padding:16px}
.diff .t{font-size:17px;font-weight:700}
.diff .d{font-size:12.5px;color:var(--dim);margin-top:4px;line-height:1.5}

/* ---------- สนามต่อสู้ ---------- */
.arena{display:grid;grid-template-columns:1fr 60px 1fr;gap:10px;align-items:center;margin-bottom:16px}
.fighter{padding:14px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(170deg,var(--panel),var(--deep));text-align:center}
.fighter .face{font-size:44px;line-height:1;transition:transform .18s}
.fighter .nm{font-size:14px;font-weight:600;margin-top:6px}
.hpbar{height:13px;border-radius:99px;background:#0C0620;border:1px solid var(--line);overflow:hidden;margin-top:8px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--hp),#2EA96D);transition:width .35s}
.hpbar.foe i{background:linear-gradient(90deg,var(--atk),#B21E3C)}
.hpnum{font-size:12px;color:var(--dim);margin-top:4px}
.vs{text-align:center;font-family:'Bai Jamjuree';font-weight:700;color:var(--dim);font-size:13px}
.shieldon{outline:2px solid var(--def);outline-offset:3px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}

.intent{text-align:center;padding:10px;border-radius:11px;background:#00000038;border:1px dashed var(--line);font-size:14px;margin-bottom:14px}
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.moves.four{grid-template-columns:repeat(4,1fr)}
.m-ult{border-color:#B58CFF;color:#B58CFF}
.skillbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.streak{font-size:13px;color:var(--dim)}
.healbtn{border-color:var(--hp);color:var(--hp);background:#00000030;font-weight:700;padding:9px 14px;font-size:14px}
.resultline{margin:12px 0 0;padding:13px 15px;border-radius:12px;background:#00000042;border:1px solid var(--line);font-size:14.5px;line-height:1.6;min-height:52px}
.resultline b{color:var(--ink)}
.move{padding:14px 8px;text-align:center;border-radius:var(--r);border:1.5px solid;background:#00000030}
.move .mi{font-size:26px;display:block}
.move .mn{font-size:14.5px;font-weight:700;margin-top:5px}
.move .md{font-size:11.5px;color:var(--dim);margin-top:2px}
.m-atk{border-color:var(--atk);color:var(--atk)} .m-pen{border-color:var(--pen);color:var(--pen)} .m-def{border-color:var(--def);color:var(--def)}
.move.sel{background:currentColor}
.move.sel .mn,.move.sel .mi,.move.sel .md{color:#0E0720}

.qbox{margin-top:16px}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--dim);margin-bottom:8px}
.timer{height:6px;border-radius:99px;background:#0C0620;overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--gold);transition:width .25s linear}
.qtext{font-size:17.5px;font-weight:600;margin:14px 0 14px;line-height:1.5}
.opts{display:grid;gap:9px}
.opt{text-align:left;padding:13px 15px;font-size:15px;font-weight:500;background:#00000030;line-height:1.5}
.opt.pick{background:#2B1B60;border-color:var(--xp)}
.opt.right{background:#1B6B45;border-color:var(--hp)}
.opt.wrong{background:#6B1B2E;border-color:var(--atk)}
.log{margin-top:14px;font-size:14px;min-height:24px;color:var(--dim)}
.log b{color:var(--ink)}

/* ---------- ตาราง ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--dim);font-weight:600}
tr.me td{background:#00000040;font-weight:600}
.pos{width:34px;color:var(--dim);font-family:'Bai Jamjuree';font-weight:700}

/* ---------- ผลลัพธ์ ---------- */
.result{text-align:center;padding:34px 20px}
.result .big{font-size:clamp(30px,8vw,46px);font-weight:700;font-family:'Bai Jamjuree'}
.win{color:var(--hp)} .lose{color:var(--atk)}
.rewards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.rw{padding:11px 16px;border-radius:11px;background:#00000038;border:1px solid var(--line);font-size:14px}
.rw b{display:block;font-size:20px;font-family:'Bai Jamjuree'}

.note{font-size:13px;color:var(--dim);line-height:1.6}
.infolist{list-style:none;margin:0}
.infolist li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.infolist li span{color:var(--dim);flex:none}
.infolist li b{text-align:right;word-break:break-word}
.adminrow{border:1px solid var(--line);border-radius:12px;background:#00000030;padding:12px;margin-bottom:10px}
.adminrow .hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:10px}
.adminrow input{padding:8px 11px;font-size:14px}
.adminfields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.adminfields{grid-template-columns:1fr}}
.reqrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px;border:1px solid var(--line);border-radius:12px;background:#00000030;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
@media(max-width:560px){
  .moves.four{grid-template-columns:repeat(2,1fr)}
  .arena{grid-template-columns:1fr 40px 1fr}
  .fighter .face{font-size:36px}
  .stages{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>

<!-- ============ เข้าสู่ระบบ ============ -->
<div id="authView">
  <div class="authbox">
    <div style="text-align:center;margin-bottom:26px">
      <div class="logo dsp">CODE<br>ARENA</div>
      <div class="sub">เกมการ์ดต่อสู้ ว21103 วิทยาการคำนวณ ม.1</div>
    </div>
    <div class="panel">
      <h3 id="authTitle">เข้าสู่ระบบ</h3>
      <label for="uname">ชื่อผู้ใช้</label>
      <input id="uname" autocomplete="username" placeholder="เช่น m1-01-somchai">
      <label for="upass" id="passLabel">รหัสผ่าน</label>
      <input id="upass" type="password" autocomplete="current-password" placeholder="อย่างน้อย 4 ตัวอักษร">
      <div id="confirmRow" class="hide">
        <label for="upass2">ยืนยันรหัสผ่านใหม่อีกครั้ง</label>
        <input id="upass2" type="password" placeholder="พิมพ์รหัสผ่านใหม่ซ้ำให้ตรงกัน">
      </div>
      <div id="nameRow" class="hide">
        <label for="ureal">ชื่อ–สกุล จริง (ไว้ให้ครูตรวจคะแนน)</label>
        <input id="ureal" placeholder="เช่น สมชาย ใจดี ม.1/2">
      </div>
      <div class="msg" id="authMsg"></div>
      <button class="primary wide" id="authGo" style="margin-top:6px">เข้าสู่ระบบ</button>
      <div class="switch">
        <span id="switchText">ยังไม่มีบัญชี?</span>
        <button id="switchBtn">สมัครสมาชิก</button>

      <div class="switch" id="forgotRow" style="margin-top:2px">
        <button id="forgotBtn">ลืมรหัสผ่าน?</button>
      </div>
    </div>
    <p class="note" style="margin-top:14px;text-align:center">
      ข้อมูลถูกเก็บไว้ในเครื่องนี้เท่านั้น อย่าใช้รหัสผ่านเดียวกับบัญชีจริงของนักเรียน
    </p>
  </div>
</div>

<!-- ============ เกม ============ -->
<div id="app" class="wrap hide">
  <div class="topbar">
    <div class="avatar" id="avatar">🧑‍💻</div>
    <div class="who">
      <b id="whoName">—</b>
      <div class="sub"><span id="whoLv"></span> · <span id="whoXp"></span></div>
      <div class="bar"><i id="xpBar" style="width:0%"></i></div>
    </div>
    <div class="rankchip" id="rankChip">บรอนซ์</div>
    <button class="ghost" id="logout" style="font-size:13px;padding:8px 12px">ออก</button>
  </div>

  <nav>
    <button data-v="map" class="on">แผนที่ด่าน</button>
    <button data-v="pvp">สนามประลอง</button>
    <button data-v="board">กระดานผู้นำ</button>
    <button data-v="profile">โปรไฟล์</button>
    <button data-v="help">กติกา</button>
    <button data-v="admin" id="navAdmin" class="hide" style="border-color:#FF4D6D;color:#FF4D6D">แอดมิน</button>
  </nav>

  <div id="viewMap"></div>
  <div id="viewLesson" class="hide"></div>
  <div id="viewBattle" class="hide"></div>
  <div id="viewPvp" class="hide"></div>
  <div id="viewBoard" class="hide"></div>
  <div id="viewProfile" class="hide"></div>
  <div id="viewAdmin" class="hide"></div>
  <div id="viewHelp" class="hide"></div>
</div>

<script>
"use strict";
/* =======================================================================
   ส่วนที่ 1 : เนื้อหาและคำถาม  ← ครูแก้ตรงนี้ได้เลย
   แต่ละด่าน:  n=เลขด่าน  t=ชื่อ  ic=ไอคอน  lesson=ใบความรู้(HTML)
   mon = มอนสเตอร์ {nm ชื่อ, ar รูป}
   q = คำถาม [{lv:1|2|3, q:โจทย์, c:[ตัวเลือก4ข้อ], a:เลขข้อที่ถูก(เริ่ม 0)}]
   lv1=ง่าย lv2=กลาง lv3=ยาก
   ======================================================================= */
const STAGES = [
{n:1,t:"แนวคิดเชิงคำนวณ",ic:"🧠",mon:{nm:"สลิมงุนงง",ar:"🫠"},
lesson:`<p><b>แนวคิดเชิงคำนวณ (Computational Thinking)</b> คือวิธีคิดแก้ปัญหาอย่างเป็นระบบ จนได้ขั้นตอนที่ชัดเจนพอที่คนอื่นหรือคอมพิวเตอร์จะทำตามได้ ไม่ได้แปลว่าต้องคิดเหมือนเครื่องจักร แต่คือการเรียบเรียงความคิดของเราให้ชัดจนสั่งงานได้</p>
<p>สิ่งสำคัญที่ต้องเข้าใจตั้งแต่ต้นคือ แนวคิดนี้ <b>ไม่จำเป็นต้องใช้คอมพิวเตอร์</b> เราใช้มันตอนวางแผนอ่านหนังสือสอบ จัดกระเป๋าไปค่าย หรือแบ่งงานกลุ่มก็ได้ คอมพิวเตอร์เป็นเพียงเครื่องมือที่ช่วยทำตามขั้นตอนที่เราคิดไว้ให้เร็วขึ้นเท่านั้น</p>
<div class="keybox"><b>4 เสาหลัก และลำดับการใช้</b>
<ul><li><b>1. การแบ่งปัญหาย่อย (Decomposition)</b> — ตัดปัญหาใหญ่ที่ดูยากเกินไป ให้เป็นชิ้นเล็กที่จัดการไหว ต้องทำก่อนเสมอ เพราะถ้ายังไม่แยกชิ้น เราจะมองไม่เห็นว่ามีอะไรซ้ำกันบ้าง</li>
<li><b>2. การหารูปแบบ (Pattern Recognition)</b> — มองหาสิ่งที่ซ้ำหรือคล้ายกันระหว่างชิ้นย่อย เพื่อใช้วิธีแก้เดิมซ้ำได้</li>
<li><b>3. การคิดเชิงนามธรรม (Abstraction)</b> — เก็บเฉพาะข้อมูลที่จำเป็น ตัดรายละเอียดที่ไม่เกี่ยวข้องทิ้ง ต้องทำหลังหารูปแบบ เพราะต้องเห็นก่อนว่าอะไรซ้ำ จึงจะรู้ว่าอะไรสำคัญจริง</li>
<li><b>4. การออกแบบอัลกอริทึม (Algorithm Design)</b> — เรียงทุกอย่างเป็นลำดับขั้นตอนที่ทำตามแล้วได้ผลเหมือนเดิมทุกครั้ง เป็นขั้นสุดท้าย</li></ul></div>
<p><b>ทั้งสี่เสาทำงานต่อเนื่องกัน</b> ไม่ได้แยกกันอยู่ ผลของเสาก่อนหน้าจะกลายเป็นวัตถุดิบของเสาถัดไป คือแบ่งย่อยให้ได้ชิ้นส่วนก่อน แล้วเอาชิ้นส่วนมาเทียบหารูปแบบ จากนั้นตัดสินว่าข้อมูลใดสำคัญ แล้วจึงเรียงทุกอย่างเป็นขั้นตอน ถ้าข้ามเสาใดเสาหนึ่งไป เสาถัดไปจะทำได้ไม่ครบ</p>
<p><b>ตัวอย่างเต็มกระบวนการ — จัดโต๊ะห้องเรียน 40 ตัว</b></p>
<ul><li>แบ่งย่อย: แยกงานเป็น “จัดแถวหน้า” “จัดแถวกลาง” “จัดแถวหลัง”</li>
<li>หารูปแบบ: ทุกแถวมี 8 โต๊ะเรียงเหมือนกันหมด ทำแถวเดียวเป็นแล้วทำได้ทุกแถว</li>
<li>นามธรรม: สนใจแค่จำนวนโต๊ะและระยะห่าง ไม่ต้องสนสีโต๊ะหรือรอยขีดข่วน</li>
<li>อัลกอริทึม: 1) วัดระยะจากผนัง 80 ซม. 2) วางโต๊ะเรียง 8 ตัว ห่างกัน 20 ซม. 3) ทำซ้ำอีก 4 แถว</li></ul>
<p><b>ประโยชน์ที่ได้จริง</b> ทำให้แก้ปัญหาซับซ้อนได้อย่างเป็นระบบ สื่อสารวิธีแก้ให้คนอื่นเข้าใจตรงกัน และเปลี่ยนความคิดของเราให้กลายเป็นคำสั่งที่คอมพิวเตอร์ทำแทนได้ แต่ต้องเข้าใจว่ามันไม่ได้ช่วยเรื่องความจำ และไม่ได้ทำให้เราจำข้อมูลได้มากขึ้นแต่อย่างใด</p>
<p><b>สัญญาณว่ายังไม่ได้ใช้แนวคิดเชิงคำนวณ</b> คือการลองสุ่มทำไปเรื่อย ๆ จนกว่าจะถูก โดยไม่มีการวางขั้นตอนหรือวิเคราะห์ล่วงหน้า</p>`,

lesson:`<p><b>การแบ่งปัญหาย่อย (Decomposition)</b> คือการแยกปัญหาใหญ่ที่ดูยากเกินไป ออกเป็นปัญหาเล็ก ๆ ที่เราแก้ได้ทีละชิ้น เป็นเสาแรกของแนวคิดเชิงคำนวณ เพราะถ้าไม่แบ่งก่อน เราจะไม่รู้เลยว่าควรเริ่มจากตรงไหน</p>
<div class="keybox"><b>ประโยชน์ 4 ข้อของการแบ่งปัญหาย่อย</b>
<ul><li><b>เข้าใจง่ายขึ้น</b> — ปัญหาชิ้นเล็กมองเห็นทางแก้ได้ชัดกว่าปัญหาก้อนใหญ่</li>
<li><b>ทำงานพร้อมกันได้</b> — แบ่งให้สมาชิกในกลุ่มรับผิดชอบคนละชิ้น งานเสร็จเร็วขึ้นมาก</li>
<li><b>หาจุดผิดได้เร็ว</b> — เมื่อเกิดข้อผิดพลาด จะจำกัดขอบเขตการค้นหาเหลือเฉพาะชิ้นที่ทำงานผิด ไม่ต้องรื้อทั้งหมด</li>
<li><b>นำกลับมาใช้ซ้ำได้</b> — ชิ้นย่อยที่ทำเสร็จแล้วนำไปใช้ในงานอื่นได้ ประหยัดเวลาในครั้งถัดไป</li></ul></div>
<p><b>การแบ่งเป็นชั้น ๆ — ตัวอย่างการทำเว็บไซต์โรงเรียน</b></p>
<ul><li>ชั้นที่ 1: ออกแบบหน้าตา / เขียนเนื้อหา / หารูปภาพ / นำขึ้นเซิร์ฟเวอร์</li>
<li>ชั้นที่ 2 (แตกจาก “ออกแบบหน้าตา”): หน้าแรก / หน้าข่าว / หน้าติดต่อ</li>
<li>ชั้นที่ 3 (แตกจาก “หน้าแรก”): แถบเมนู / ภาพหัวเรื่อง / ส่วนข่าวล่าสุด</li></ul>
<p><b>เกณฑ์ว่าแบ่งพอหรือยัง</b> ให้ถามตัวเองว่า “ชิ้นนี้ฉันบอกได้ไหมว่าต้องลงมือทำอะไรเป็นข้อแรก” ถ้าตอบได้ทันทีแปลว่าพอแล้ว ถ้ายังตอบไม่ได้แปลว่ายังใหญ่ไป ให้แบ่งต่อ ยิ่งชิ้นย่อยลงลึกหลายชั้น ยิ่งบอกขั้นตอนได้ละเอียด เช่น “ทำอาหาร” หยาบกว่า “ทำอาหารเช้า” และหยาบกว่า “ต้มไข่: ต้มน้ำ → ใส่ไข่ → จับเวลา 7 นาที → ตักขึ้น” มาก</p>
<p><b>ข้อควรระวัง</b> แบ่งย่อยเกินไปจนกลายเป็นสิบ ๆ ชิ้นจิ๋ว ๆ จะเสียเวลาจัดการชิ้นย่อยมากกว่าลงมือทำจริง ต้องแบ่งให้พอดีกับขนาดงาน และการรวมทุกขั้นตอนเป็นคำสั่งเดียวแล้วทำรวดเดียวนั้น <u>ไม่ใช่</u> การแบ่งปัญหาย่อย</p>`,

{n:3,t:"การหารูปแบบ",ic:"🔁",mon:{nm:"งูซ้ำลาย",ar:"🐍"},
lesson:`<p><b>การหารูปแบบ (Pattern Recognition)</b> คือการมองหาสิ่งที่ซ้ำกันหรือคล้ายกัน ทั้งภายในปัญหาเดียวและระหว่างปัญหาหลาย ๆ ปัญหา เป็นขั้นที่ทำต่อจากการแบ่งปัญหาย่อย เพราะต้องมีชิ้นส่วนให้เปรียบเทียบกันก่อน</p>
<div class="keybox"><b>รูปแบบ 3 ประเภทที่พบบ่อย</b>
<ul><li><b>รูปแบบของลำดับตัวเลข</b> เช่น 2, 4, 6, 8 (บวกทีละ 2) · 1, 2, 4, 8 (คูณ 2) · 1, 4, 9, 16 (กำลังสองของจำนวนนับ) · 1, 1, 2, 3, 5, 8 (ลำดับฟีโบนักชี คือบวกสองตัวหน้าเข้าด้วยกัน)</li>
<li><b>รูปแบบของขั้นตอน</b> เช่น การเช็กชื่อทุกเช้าใช้ขั้นตอนเดิมทุกวัน เปลี่ยนแค่วันที่</li>
<li><b>รูปแบบของโครงสร้าง</b> เช่น ทุกหน้าเว็บของโรงเรียนมีแถบเมนูและส่วนท้ายเหมือนกัน</li></ul></div>
<div class="keybox"><b>ฝึกอ่านลำดับตัวเลข — วิธีดูคือหา “ผลต่าง” ของตัวที่ติดกันก่อนเสมอ</b>
<ul><li><b>บวกทีละเท่า ๆ กัน</b> ผลต่างคงที่ เช่น 3, 6, 9, 12 → 15 (บวก 3) · 4, 8, 12, 16 → 20 (บวก 4) · 5, 10, 15, 20 → 25 (บวก 5) · 7, 14, 21, 28 → 35 (บวก 7)</li>
<li><b>ลบทีละเท่า ๆ กัน</b> เช่น 20, 18, 16, 14 → 12 (ลบ 2) · 100, 90, 80, 70 → 60 (ลบ 10)</li>
<li><b>คูณทีละเท่า ๆ กัน</b> เช่น 2, 4, 8, 16, 32 → 64, 128, 256 (คูณ 2) · 3, 6, 12, 24 → 48, 96 (คูณ 2) · 2, 6, 18, 54 → 162 (คูณ 3)</li>
<li><b>กำลังสองของจำนวนนับ</b> 1, 4, 9, 16, 25 → 36 คือ 1×1, 2×2, 3×3 ไปเรื่อย ๆ</li>
<li><b>ผลต่างเพิ่มทีละหนึ่ง</b> 1, 3, 6, 10, 15 → 21 เพราะผลต่างคือ 2, 3, 4, 5, 6</li>
<li><b>ผลต่างเพิ่มเป็นเท่าตัว</b> 2, 3, 5, 9, 17 → 33 เพราะผลต่างคือ 1, 2, 4, 8, 16</li>
<li><b>ลำดับฟีโบนักชี</b> 1, 1, 2, 3, 5, 8 → 13 คือบวกสองตัวหน้าเข้าด้วยกัน</li></ul>
<p>ถ้าผลต่างไม่คงที่ ให้ลองหาผลต่างของผลต่างอีกชั้นหนึ่ง หรือลองหารดูว่าคูณด้วยเลขเดิมหรือไม่</p></div>
<p><b>เจอรูปแบบแล้วได้ประโยชน์อะไร</b></p>
<ul><li>ใช้วิธีแก้เดิมซ้ำได้ ไม่ต้องคิดใหม่ทุกครั้ง ประหยัดเวลามาก</li>
<li>นำไปเขียนเป็นคำสั่งวนซ้ำ (loop) ในโปรแกรม ทำให้โค้ดสั้นลงมาก</li>
<li>ทำนายสิ่งที่จะเกิดขึ้นต่อไปได้ เช่น ทำนายยอดขายเดือนหน้า</li></ul>
<p>แต่ต้องเข้าใจว่าการหารูปแบบ <u>ไม่ได้</u> ทำให้ข้อมูลถูกต้องเสมอโดยไม่ต้องตรวจสอบ</p>
<p><b>ตัวอย่างการนำไปใช้</b> ถ้าต้องวาดรูปสี่เหลี่ยม แทนที่จะเขียนคำสั่ง “เดินหน้า 100 ก้าว แล้วหมุน 90 องศา” สี่ครั้ง เราสังเกตรูปแบบว่ามันซ้ำกัน 4 รอบ จึงเขียนเหลือแค่ “ทำซ้ำ 4 ครั้ง: เดินหน้า 100 ก้าว หมุน 90 องศา” ถ้าเป็นสามเหลี่ยมด้านเท่าก็เปลี่ยนเป็น “ทำซ้ำ 3 ครั้ง: เดินหน้า 100 ก้าว หมุน 120 องศา” เพราะมุมรอบจุดหนึ่งรอบเท่ากับ 360 องศา หารด้วยจำนวนด้าน</p>
<p><b>ข้อควรระวัง</b> บางครั้งสิ่งที่ดูเหมือนซ้ำอาจไม่ซ้ำจริง ต้องตรวจสอบอย่างน้อย 3 ตัวอย่างก่อนสรุปว่าเป็นรูปแบบ เช่น 1, 2, 4 อาจเป็นคูณ 2 หรืออาจเป็น 1, 2, 4, 7 (ผลต่างเพิ่มทีละ 1, 2, 3) ก็ได้ การเห็นรูปแบบผิดทำให้ทำนายและออกแบบวิธีแก้ผิดตามไปด้วย</p>`,

{n:4,t:"การคิดเชิงนามธรรม",ic:"🌫️",mon:{nm:"หมอกรกข้อมูล",ar:"🌁"},
lesson:`<p><b>การคิดเชิงนามธรรม (Abstraction)</b> คือการคัดเลือกเฉพาะข้อมูลที่จำเป็นต่อการแก้ปัญหา แล้วตัดรายละเอียดที่ไม่เกี่ยวข้องทิ้งไป จุดประสงค์คือทำให้เห็นแก่นของปัญหาชัดขึ้น ไม่ใช่เพื่อลดปริมาณข้อมูลให้น้อยที่สุด</p>
<div class="keybox"><b>แผนที่รถไฟฟ้า — ตัวอย่างที่ดีที่สุด</b>
<p>แผนที่รถไฟฟ้าไม่แสดงถนน ต้นไม้ อาคาร หรือระยะทางจริง แสดงเพียง “สถานีไหนต่อกับสถานีไหน” และ “ต้องเปลี่ยนสายที่ไหน” เพราะนั่นคือสิ่งเดียวที่ผู้โดยสารต้องรู้ ถ้าใส่ทุกอย่างลงไป แผนที่จะอ่านไม่รู้เรื่อง</p></div>
<p><b>สองคำถามที่ใช้ตัดสินว่าจะเก็บหรือตัด</b></p>
<ul><li>ข้อมูลนี้จำเป็นต่อการหาคำตอบหรือไม่ — ถ้าไม่ ตัดทิ้ง</li>
<li>ถ้าไม่มีข้อมูลนี้ คำตอบจะเปลี่ยนไปไหม — ถ้าไม่เปลี่ยน ตัดทิ้ง</li></ul>
<p><b>ตัวอย่าง — ระบบยืมหนังสือห้องสมุด</b><br>
เก็บ: รหัสหนังสือ, ชื่อหนังสือ, ชื่อผู้ยืม, วันที่ยืม, วันครบกำหนด<br>
ไม่เก็บ: สีปกหนังสือ, น้ำหนักหนังสือ, สีเสื้อผู้ยืม เพราะไม่มีผลต่อการติดตามคืนหนังสือ</p>
<p><b>ตัวอย่างเพิ่มเติม — ระบบเช็กชื่อเข้าเรียน</b><br>
เก็บ: ชื่อนักเรียน, เลขประจำตัว, วันที่, สถานะมาเรียนหรือขาด<br>
ไม่เก็บ: สีกระเป๋า อาหารเช้าที่กิน เพลงที่ชอบ เพราะไม่มีผลต่อการสรุปว่าใครมาเรียนบ้าง</p>
<p><b>ตัวอย่างเพิ่มเติม — ระบบยืมจักรยานสาธารณะ</b><br>
เก็บ: รหัสจักรยาน, ผู้ยืม, เวลายืม, เวลาคืน · ไม่เก็บ: สีอาน ยี่ห้อกระดิ่ง น้ำหนักตะกร้า</p>
<p><b>ความสัมพันธ์กับเสาอื่น</b> การแบ่งปัญหาย่อยช่วยให้เห็นชิ้นส่วนทั้งหมด ส่วนการคิดเชิงนามธรรมช่วยตัดสินว่าชิ้นไหนและข้อมูลใดที่สำคัญจริง ทั้งสองจึงทำงานเสริมกัน และผลของการคิดเชิงนามธรรมยังบอกเราด้วยว่าในโปรแกรมต้องสร้างตัวแปรอะไรบ้าง</p>
<p><b>ข้อควรระวัง</b> ถ้าตัดมากเกินไปจนข้อมูลสำคัญหายไป จะแก้ปัญหาไม่ได้เลย เช่น ถ้าระบบยืมหนังสือไม่เก็บ “วันครบกำหนด” ก็จะไม่รู้ว่าใครคืนช้า หรือระบบคะแนนที่ไม่เก็บชื่อวิชาแต่เก็บแต่คะแนนรวม ก็จะไม่รู้ว่านักเรียนอ่อนวิชาใด การคิดเชิงนามธรรมจึงต้องพอดี</p>`,

{n:5,t:"อัลกอริทึม",ic:"📋",mon:{nm:"โกเลมไร้ลำดับ",ar:"🗿"},
lesson:`<p><b>อัลกอริทึม (Algorithm)</b> คือลำดับขั้นตอนการทำงานที่ชัดเจน ทำตามแล้วได้ผลลัพธ์เหมือนกันทุกครั้ง คำนี้มาจากชื่อของนักคณิตศาสตร์ชาวเปอร์เซีย “อัล-คอวาริซมี” ผู้วางรากฐานวิธีคำนวณอย่างเป็นขั้นตอน</p>
<div class="keybox"><b>คุณสมบัติของอัลกอริทึมที่ดี 4 ข้อ</b>
<ul><li><b>มีจุดเริ่มต้นและจุดสิ้นสุดชัดเจน</b> — รู้ว่าเริ่มตรงไหน จบตรงไหน</li>
<li><b>ไม่กำกวม</b> — แต่ละขั้นตอนตีความได้ทางเดียว ทุกคนอ่านแล้วเข้าใจตรงกัน จึงได้ผลลัพธ์เหมือนกัน</li>
<li><b>มีที่สิ้นสุด</b> — ทำตามแล้วจบได้จริง ถ้าทำงานแล้วไม่มีวันหยุด ถือว่าผิดคุณสมบัติข้อการสิ้นสุด</li>
<li><b>ให้ผลลัพธ์ถูกต้อง</b> — แก้ปัญหาได้จริงตามที่ตั้งใจ</li></ul>
<p>สังเกตว่า “ยิ่งมีขั้นตอนมากยิ่งดี” <u>ไม่ใช่</u> คุณสมบัติของอัลกอริทึมที่ดี</p></div>
<p><b>ตัวอย่างอัลกอริทึม — ต้มมาม่า</b></p>
<ul><li>1) ต้มน้ำ 400 มิลลิลิตรจนเดือด</li><li>2) ใส่เส้นลงในน้ำ</li><li>3) รอ 3 นาที</li><li>4) ใส่เครื่องปรุงแล้วคน</li><li>5) ตักใส่ชามและเสิร์ฟ</li></ul>
<p>ถ้าเขียนขั้นที่ 3 ว่า “ต้มไปสักพัก” จะกำกวมทันที เพราะแต่ละคนตีความไม่เท่ากัน อัลกอริทึมที่ดีต้องระบุให้วัดได้ เช่น “3 นาที” หรือ “ใส่เกลือ 1 ช้อนชา” ไม่ใช่ “ใส่เกลือพอประมาณ”</p>
<div class="keybox"><b>ปัญหาเดียวมีได้หลายอัลกอริทึม</b>
<p>การหาชื่อในสมุดโทรศัพท์ อาจไล่ดูทีละหน้าตั้งแต่ต้น (ช้าแต่ง่าย) หรือเปิดกลางเล่มแล้วตัดครึ่งไปเรื่อย ๆ (เร็วกว่ามาก) ทั้งสองวิธี <u>ถูกต้องเหมือนกัน</u> แต่ต่างกันที่ <b>ประสิทธิภาพ</b> ถ้าอัลกอริทึม A เสร็จใน 10 ขั้นตอน ส่วน B ใช้ 100 ขั้นตอนแต่ได้ผลเท่ากัน แปลว่า A มีประสิทธิภาพดีกว่า ไม่ได้แปลว่า B ผิด</p></div>
<p><b>ทำไมต้องออกแบบอัลกอริทึมก่อนเขียนโปรแกรม</b> เพื่อตรวจสอบความคิดให้ถูกต้องก่อนลงมือ ลดการแก้ไขภายหลังซึ่งเสียเวลามากกว่า และทำให้คนในทีมเข้าใจตรงกัน</p>`,

{n:6,t:"ผังงาน (Flowchart)",ic:"🔷",mon:{nm:"ภูตข้าวหลามตัด",ar:"🔶"},
lesson:`<p><b>ผังงาน (Flowchart)</b> คือการแสดงอัลกอริทึมด้วยสัญลักษณ์ภาพและลูกศร ทำให้มองเห็นลำดับการทำงานและทางแยกได้ทันทีโดยไม่ต้องอ่านข้อความยาว ๆ จึงมีข้อได้เปรียบเหนือรหัสลำลองในเรื่องการเห็นภาพรวม</p>
<div class="keybox"><b>สัญลักษณ์มาตรฐาน 5 อย่างที่ต้องจำ</b>
<ul><li><b>วงรี</b> — จุดเริ่มต้น (Start) หรือจุดสิ้นสุด (End)</li>
<li><b>สี่เหลี่ยมด้านขนาน</b> — รับข้อมูลเข้า (Input) และแสดงผลออก (Output) ใช้สัญลักษณ์เดียวกันทั้งสองอย่าง</li>
<li><b>สี่เหลี่ยมผืนผ้า</b> — ประมวลผล คำนวณ หรือกำหนดค่าให้ตัวแปร</li>
<li><b>สี่เหลี่ยมข้าวหลามตัด</b> — การตัดสินใจ ต้องมีทางออกอย่างน้อย 2 ทาง คือ ใช่ และ ไม่ใช่</li>
<li><b>ลูกศร</b> — ทิศทางการไหลของงาน ต้องมีกำกับทุกเส้นเชื่อม</li></ul></div>
<p><b>กฎการเขียนผังงาน</b></p>
<ul><li>มีจุดเริ่มต้นเพียง 1 จุดเท่านั้น</li>
<li>ทุกเส้นทางต้องไปจบที่จุดสิ้นสุด ถ้ามีเส้นทางที่ค้างอยู่กลางทางถือว่าผิด</li>
<li>ลูกศรควรไหลจากบนลงล่างและซ้ายไปขวาเป็นหลัก</li>
<li>ที่เส้นออกของสี่เหลี่ยมข้าวหลามตัด ต้องเขียนกำกับว่าเส้นใดคือ “ใช่” เส้นใดคือ “ไม่ใช่” มิฉะนั้นผู้อ่านจะไม่รู้ว่าต้องไปทางไหน</li>
<li>ถ้าสี่เหลี่ยมข้าวหลามตัดวนกลับมาที่ตัวเองโดยไม่มีทางออก จะกลายเป็นการวนไม่รู้จบและไม่มีวันถึงจุดสิ้นสุด</li></ul>
<p><b>ตัวอย่างเต็ม — ตรวจว่าสอบผ่านหรือไม่</b><br>
เริ่มต้น (วงรี) → รับค่าคะแนน (ด้านขนาน) → คะแนน ≥ 50 หรือไม่ (ข้าวหลามตัด) → ถ้าใช่ แสดง “ผ่าน” / ถ้าไม่ใช่ แสดง “ไม่ผ่าน” (ด้านขนาน) → สิ้นสุด (วงรี)</p>
<p>สังเกตลำดับให้ดี ต้อง <b>รับข้อมูลก่อน</b> จึงจะตัดสินใจได้ ถ้าเอาการตัดสินใจไว้ก่อนรับค่า ผังงานจะผิดทันทีเพราะยังไม่มีข้อมูลให้ตัดสิน</p>`,

{n:7,t:"รหัสลำลอง",ic:"📝",mon:{nm:"นักเขียนคำกำกวม",ar:"👻"},
lesson:`<p><b>รหัสลำลอง (Pseudocode)</b> คือการเขียนอัลกอริทึมด้วยข้อความคล้ายภาษาพูด แต่จัดโครงสร้างเหมือนโปรแกรม ใช้สื่อสารความคิดกันในทีมก่อนลงมือเขียนโค้ดจริง คนที่ยังเขียนโปรแกรมไม่เป็นก็อ่านเข้าใจได้</p>
<div class="keybox"><b>คำสั่งพื้นฐานที่ใช้บ่อย</b>
<ul><li><b>รับค่า</b> ... — รับข้อมูลเข้าจากผู้ใช้</li>
<li><b>กำหนดให้</b> ... = ... — เก็บค่าลงตัวแปร</li>
<li><b>ถ้า</b> ... <b>แล้ว</b> ... <b>มิฉะนั้น</b> ... — การตัดสินใจ</li>
<li><b>ทำซ้ำ</b> ... — การวนซ้ำ</li>
<li><b>แสดง</b> ... — แสดงผลลัพธ์</li></ul></div>
<p><b>ตัวอย่าง — ตรวจว่าอายุถึงเกณฑ์สมัครหรือไม่</b></p>
<ul style="list-style:none;margin-left:0"><li>เริ่มต้น</li><li>&nbsp;&nbsp;รับค่า อายุ</li><li>&nbsp;&nbsp;ถ้า อายุ ≥ 13 แล้ว</li><li>&nbsp;&nbsp;&nbsp;&nbsp;แสดง “สมัครได้”</li><li>&nbsp;&nbsp;มิฉะนั้น</li><li>&nbsp;&nbsp;&nbsp;&nbsp;แสดง “ยังไม่ถึงเกณฑ์”</li><li>สิ้นสุด</li></ul>
<p>ถ้าอายุเท่ากับ 13 พอดี จะได้ “สมัครได้” เพราะใช้เครื่องหมายมากกว่าหรือเท่ากับ</p>
<p><b>การย่อหน้าสำคัญมาก</b> คำสั่งที่อยู่ภายใต้ “ถ้า” หรือ “ทำซ้ำ” ต้องย่อหน้าเข้าไป เพื่อให้เห็นชัดว่าคำสั่งใดอยู่ในเงื่อนไขและคำสั่งใดอยู่นอกเงื่อนไข ถ้าลืมย่อหน้า ผู้อ่านอาจเข้าใจผิดว่าคำสั่งนั้นทำงานเสมอ ทั้งที่ควรทำเฉพาะเมื่อเงื่อนไขเป็นจริง</p>
<div class="keybox"><b>การไล่ค่าตามรหัสลำลอง</b>
<p>ให้อ่านทีละบรรทัดจากบนลงล่างแล้วจดค่าตัวแปรไว้ เช่น <br>
กำหนดให้ x = 5 → x คือ 5<br>
กำหนดให้ x = x + 3 → เอาค่าเดิม 5 บวก 3 ได้ 8 แล้วเก็บกลับลงใน x<br>
แสดง x → ได้ผลลัพธ์ 8</p></div>
<p><b>เปรียบเทียบกับผังงาน</b> ทั้งสองใช้อธิบายลำดับขั้นตอนของอัลกอริทึมเหมือนกัน ผังงานเห็นภาพรวมและทางแยกได้ดีกว่า ส่วนรหัสลำลองเขียนเร็วกว่าและแปลงเป็นโค้ดจริงได้ง่ายกว่า แต่ทั้งคู่ <u>รันบนคอมพิวเตอร์ไม่ได้</u> ต้องแปลงเป็นภาษาโปรแกรมก่อนเสมอ</p>`,

{n:8,t:"ตัวแปรและชนิดข้อมูล",ic:"📦",mon:{nm:"กล่องกลืนค่า",ar:"🎁"},
lesson:`<p><b>ตัวแปร (Variable)</b> คือชื่อที่เราตั้งขึ้นเพื่อใช้เก็บข้อมูลในหน่วยความจำ เปรียบเหมือนกล่องที่มีป้ายชื่อติดไว้ เราหยิบของเดิมออกแล้วใส่ของใหม่เข้าไปได้ แต่ป้ายชื่อยังเหมือนเดิม</p>
<div class="keybox"><b>ชนิดข้อมูลพื้นฐาน 4 ชนิด</b>
<ul><li><b>จำนวนเต็ม (Integer)</b> เช่น 7, 25, -3 ใช้กับสิ่งที่นับเป็นชิ้นได้ เช่น จำนวนนักเรียน</li>
<li><b>ทศนิยม (Float)</b> เช่น 3.14, 72.5 ใช้กับค่าที่ต้องการความละเอียด เช่น น้ำหนัก ส่วนสูง</li>
<li><b>ข้อความ (String)</b> เช่น “สมชาย”, “ม.1/2” ต้องอยู่ในเครื่องหมายคำพูดเสมอ</li>
<li><b>ตรรกะ (Boolean)</b> มีเพียง 2 ค่าเท่านั้น คือ จริง (true) หรือ เท็จ (false) เหมาะกับข้อมูลที่ตอบได้แค่ใช่หรือไม่ เช่น นักเรียนมาเรียนหรือไม่</li></ul></div>
<p><b>เครื่องหมาย = ในการเขียนโปรแกรม</b> ไม่ได้แปลว่า “เท่ากับ” แต่แปลว่า “นำค่าทางขวาไปเก็บในตัวแปรทางซ้าย” เช่น <code>คะแนน = 85</code> คือใส่ 85 ลงกล่องชื่อคะแนน ถ้าเขียนต่อว่า <code>คะแนน = 90</code> ค่า 85 จะถูกทับหายไปทันที</p>
<p>คำสั่ง <code>x = x + 1</code> จึงไม่ใช่สมการที่เป็นไปไม่ได้ แต่แปลว่า “เอาค่าเดิมของ x บวก 1 แล้วเก็บกลับลงไปใน x” ถ้า x เดิมเป็น 10 หลังคำสั่งนี้ x จะเป็น 11</p>
<p><b>การกำหนดค่าใหม่ทับค่าเก่าเสมอ</b> ตัวแปรหนึ่งตัวเก็บได้ครั้งละหนึ่งค่าเท่านั้น เมื่อกำหนดค่าใหม่ ค่าเก่าจะถูกแทนที่และหายไปทันที ไม่ได้เก็บไว้ทั้งสองค่าและไม่ได้ย้ายไปไหน ถ้าอยากเก็บค่าเก่าไว้ด้วยต้องสร้างตัวแปรอีกตัวมารับก่อน</p>
<div class="keybox"><b>ระวังเรื่องการสลับค่า</b>
<p>ถ้า a = 3 และ b = 4 แล้วสั่ง <code>a = b</code> ตามด้วย <code>b = a</code> ผลจะได้ a = 4 และ b = 4 ไม่ใช่การสลับ เพราะค่าเดิมของ a ถูกทับไปแล้วตั้งแต่คำสั่งแรก การสลับค่าจริง ๆ ต้องใช้ตัวแปรพักค่าเพิ่มอีกหนึ่งตัว</p></div>
<p><b>หลักตั้งชื่อตัวแปรที่ดี</b> ตั้งให้สื่อความหมาย เช่นใช้ <code>ส่วนสูงนักเรียน</code> แทน <code>x</code> หรือ <code>ss1</code> ห้ามขึ้นต้นด้วยตัวเลข เช่น <code>2คะแนน</code> ใช้ไม่ได้ ห้ามมีช่องว่าง และไม่ควรใช้คำสงวนของภาษา</p>
<p><b>ข้อควรระวังเรื่องชนิดข้อมูล</b> ข้อมูลที่เป็นตัวเลขแต่ไม่ได้ใช้คำนวณ เช่น เบอร์โทรศัพท์ เลขประจำตัวนักเรียน หรือรหัสไปรษณีย์ ควรเก็บเป็นข้อความ เพราะถ้าเก็บเป็นจำนวนเต็ม เลข 0 ข้างหน้าจะหายไป</p>`,

lesson:`<p><b>เงื่อนไข (Selection)</b> คือโครงสร้างที่ทำให้โปรแกรมเลือกเส้นทางการทำงานต่างกันตามสถานการณ์ ถ้าไม่มีเงื่อนไข โปรแกรมจะทำงานเหมือนเดิมทุกครั้งไม่ว่าข้อมูลจะเปลี่ยนไปแค่ไหน</p>
<div class="keybox"><b>เครื่องหมายเปรียบเทียบ</b>
<ul><li><code>&gt;</code> มากกว่า &nbsp;·&nbsp; <code>&lt;</code> น้อยกว่า</li>
<li><code>&gt;=</code> มากกว่าหรือเท่ากับ &nbsp;·&nbsp; <code>&lt;=</code> น้อยกว่าหรือเท่ากับ</li>
<li><code>==</code> เท่ากับ ใช้สองขีดเพื่อไม่ให้สับสนกับการกำหนดค่า &nbsp;·&nbsp; <code>!=</code> ไม่เท่ากับ</li></ul>
<p>ผลลัพธ์ของการเปรียบเทียบเป็นข้อมูลตรรกะเสมอ คือ จริง หรือ เท็จ เท่านั้น เช่น 7 &gt; 3 ได้ จริง ส่วน 5 == 8 ได้ เท็จ</p></div>
<div class="keybox"><b>ฝึกหาผลของการเปรียบเทียบ — ตอบได้แค่ จริง หรือ เท็จ</b>
<ul><li>7 &gt; 3 → <b>จริง</b> เพราะ 7 มากกว่า 3</li>
<li>3 &lt; 8 → <b>จริง</b> · 4 &lt;= 4 → <b>จริง</b> เพราะเท่ากันก็นับว่าผ่าน</li>
<li>5 == 8 → <b>เท็จ</b> เพราะไม่เท่ากัน · 9 != 9 → <b>เท็จ</b> เพราะมันเท่ากันพอดี</li></ul></div>
<div class="keybox"><b>ตารางค่าความจริงของ และ / หรือ</b>
<table><tr><th>เงื่อนไข ก</th><th>เงื่อนไข ข</th><th>ก และ ข</th><th>ก หรือ ข</th></tr>
<tr><td>จริง</td><td>จริง</td><td>จริง</td><td>จริง</td></tr>
<tr><td>จริง</td><td>เท็จ</td><td>เท็จ</td><td>จริง</td></tr>
<tr><td>เท็จ</td><td>จริง</td><td>เท็จ</td><td>จริง</td></tr>
<tr><td>เท็จ</td><td>เท็จ</td><td>เท็จ</td><td>เท็จ</td></tr></table>
<p style="margin-top:10px"><b>ตัวอย่างการคิดทีละขั้น</b><br>
(5 == 5) และ (2 &gt; 1) → จริง และ จริง → <b>จริง</b><br>
(10 &gt; 5) และ (3 &gt; 7) → จริง และ เท็จ → <b>เท็จ</b><br>
(4 &gt; 9) หรือ (1 &gt; 3) → เท็จ หรือ เท็จ → <b>เท็จ</b><br>
(2 &gt; 9) หรือ (6 &lt; 8) → เท็จ หรือ จริง → <b>จริง</b><br>
ถ้า a = 5 และ b = 5 : (a &gt;= b) และ (a != b) → จริง และ เท็จ → <b>เท็จ</b></p></div>
<p><b>รูปแบบเงื่อนไข 3 แบบ</b></p>
<ul><li><b>ทางเดียว</b> — ถ้าเงื่อนไขจริงให้ทำ ถ้าเท็จก็ข้ามไปเฉย ๆ</li>
<li><b>สองทาง</b> — ใช้ “ถ้า ... มิฉะนั้น ...” จริงทำอย่างหนึ่ง เท็จทำอีกอย่าง</li>
<li><b>หลายทาง</b> — ตรวจทีละเงื่อนไขเรียงลงมา เช่น ตัดเกรด 80 ขึ้นไปได้ 4, 70 ขึ้นไปได้ 3, 60 ขึ้นไปได้ 2</li></ul>
<div class="keybox"><b>ตัวดำเนินการทางตรรกะ</b>
<ul><li><b>และ (AND)</b> — เป็นจริงเมื่อ <u>ทั้งสอง</u> เงื่อนไขจริง เช่น (10 &gt; 5) และ (3 &gt; 7) ได้ เท็จ เพราะเงื่อนไขหลังเป็นเท็จ</li>
<li><b>หรือ (OR)</b> — เป็นจริงเมื่อมี <u>อย่างน้อยหนึ่ง</u> เงื่อนไขจริง</li>
<li><b>ไม่ (NOT)</b> — กลับค่าจากจริงเป็นเท็จ และเท็จเป็นจริง</li></ul>
<p>ถ้าต้องการตรวจว่าคะแนนอยู่ระหว่าง 50 ถึง 79 ต้องเขียนว่า คะแนน ≥ 50 <b>และ</b> คะแนน ≤ 79 ถ้าใช้ “หรือ” จะกลายเป็นจริงเกือบทุกกรณี</p></div>
<p><b>ลำดับสำคัญมากในเงื่อนไขหลายทาง</b> ถ้าเขียน “ถ้าคะแนน ≥ 60 ได้เกรด 2” ไว้ก่อน “ถ้าคะแนน ≥ 80 ได้เกรด 4” นักเรียนที่ได้ 90 คะแนนจะติดเงื่อนไขแรกและได้เกรด 2 ทันที เพราะโปรแกรมตรวจจากบนลงล่างและหยุดที่เงื่อนไขแรกที่เป็นจริง จึงต้องเรียงจากเงื่อนไขที่เข้มงวดที่สุดลงมาหาที่หลวมที่สุด</p>
<p><b>ระวังเรื่องเครื่องหมายเท่ากับ</b> ถ้าคะแนน = 50 พอดี แล้วเงื่อนไขเขียนว่า คะแนน ≥ 50 จะได้ “ผ่าน” แต่ถ้าเขียนว่า คะแนน &gt; 50 จะได้ “ไม่ผ่าน” ต่างกันเพียงขีดเดียวแต่ผลต่างกันสิ้นเชิง</p>`,

{n:10,t:"การวนซ้ำ",ic:"♻️",mon:{nm:"วงจรไม่รู้จบ",ar:"🌀"},
lesson:`<p><b>การวนซ้ำ (Loop / Repetition)</b> คือการสั่งให้ทำงานชุดเดิมซ้ำหลายรอบ โดยเขียนคำสั่งเพียงครั้งเดียว เป็นการนำ “รูปแบบที่ซ้ำกัน” ที่เราหาเจอมาใช้ประโยชน์โดยตรง</p>
<div class="keybox"><b>การวนซ้ำ 2 แบบ</b>
<ul><li><b>วนตามจำนวนรอบ</b> — ใช้เมื่อรู้ล่วงหน้าว่าทำกี่ครั้ง เช่น “ทำซ้ำ 10 ครั้ง” หรือ “ทำซ้ำ 12 ครั้ง” เหมาะกับการวาดรูปหลายเหลี่ยม หรือประมวลผลข้อมูลจำนวนที่รู้แน่นอน</li>
<li><b>วนตามเงื่อนไข</b> — ใช้เมื่อไม่รู้ว่าต้องทำกี่ครั้ง ทำไปเรื่อย ๆ จนกว่าเงื่อนไขจะเป็นเท็จ เช่น “ทำซ้ำขณะที่ พลังชีวิต &gt; 0” หรือ “ทำซ้ำจนกว่าผู้ใช้จะกรอกรหัสถูก”</li></ul></div>
<p><b>ทำไมต้องใช้</b> ถ้าจะสั่ง “ก้าวไปข้างหน้า” 100 ครั้ง โดยไม่ใช้การวนซ้ำ ต้องพิมพ์ 100 บรรทัด แต่ถ้าใช้การวนซ้ำ เขียนแค่ 2 บรรทัด และถ้าอยากเปลี่ยนเป็น 500 ครั้ง ก็แก้ตัวเลขเพียงจุดเดียว ไม่ต้องพิมพ์เพิ่ม 400 บรรทัด</p>
<div class="keybox"><b>ตัวนับ (Counter)</b>
<p>การวนซ้ำมักใช้ตัวแปรนับรอบร่วมด้วย เช่น เริ่มจาก i = 1 แล้วเพิ่มทีละ 1 ทุกรอบจนถึงค่าที่กำหนด<br>
ตัวอย่าง: เริ่ม i = 1 ทำซ้ำขณะที่ i ≤ 4 โดยแต่ละรอบแสดงค่า i แล้วเพิ่ม i ทีละ 1 จะแสดง 1, 2, 3, 4 รวม 4 ตัว<br>
อีกตัวอย่าง: เริ่มจาก 0 ทำซ้ำ 5 ครั้ง นับเพิ่มทีละ 2 จะได้ 2, 4, 6, 8, 10 ค่าสุดท้ายคือ 10</p></div>
<p><b>Infinite loop — บั๊กที่พบบ่อยที่สุด</b> ถ้าเงื่อนไขไม่มีวันเป็นเท็จ โปรแกรมจะวนไม่รู้จบจนค้าง สาเหตุหลักคือเงื่อนไขไม่มีทางเป็นเท็จได้ เช่น “ทำซ้ำขณะที่ 1 = 1” หรือเขียน “ทำซ้ำขณะที่ x &lt; 10” แต่ลืมเพิ่มค่า x ภายในลูป ค่า x จะเท่าเดิมตลอด เงื่อนไขจึงจริงตลอดไป</p>
<p><b>วิธีป้องกัน</b> ตรวจเสมอว่าภายในลูปมีคำสั่งที่ทำให้เงื่อนไขเข้าใกล้ความเท็จ เช่น มีการเพิ่มหรือลดค่าตัวนับ หรือมีทางออกที่ผู้ใช้สั่งหยุดได้</p>`,

{n:11,t:"เริ่มเขียนโปรแกรมด้วย Scratch",ic:"🐱",mon:{nm:"บล็อกจอมกวน",ar:"🧱"},
lesson:`<p><b>Scratch</b> เป็นเครื่องมือเขียนโปรแกรมแบบบล็อก พัฒนาโดยสถาบัน MIT ใช้การลากบล็อกคำสั่งมาต่อกันแทนการพิมพ์โค้ด จึงไม่มีข้อผิดพลาดจากการสะกดคำสั่งผิด เหมาะกับผู้เริ่มต้นมาก</p>
<div class="keybox"><b>ส่วนประกอบของหน้าจอ</b>
<ul><li><b>เวที (Stage)</b> — พื้นที่แสดงผลการทำงาน อยู่มุมบนขวา</li>
<li><b>ตัวละคร (Sprite)</b> — สิ่งที่เราสั่งให้ทำงาน มีได้หลายตัวในโปรเจกต์เดียว และแต่ละตัวมีชุดคำสั่งของตัวเอง</li>
<li><b>กล่องบล็อก</b> — คลังคำสั่งทางซ้าย แบ่งเป็นหมวดตามสี</li>
<li><b>พื้นที่เขียนสคริปต์</b> — ตรงกลาง ไว้ลากบล็อกมาต่อกัน</li></ul></div>
<p><b>หมวดบล็อกที่ใช้บ่อยและสีประจำหมวด</b></p>
<ul><li><b>เหตุการณ์ (สีเหลือง)</b> — เช่น “เมื่อคลิกธงเขียว” เป็นตัวสั่งให้โปรแกรมเริ่มทำงาน</li>
<li><b>การเคลื่อนไหว (สีฟ้า)</b> — เดินไปข้างหน้า หมุน เปลี่ยนตำแหน่ง</li>
<li><b>การควบคุม (สีส้ม)</b> — ทำซ้ำ ถ้า...แล้ว รอ</li>
<li><b>รูปลักษณ์ (สีม่วง)</b> — พูด เปลี่ยนชุด ซ่อน แสดง</li></ul>
<p><b>หลักการทำงาน</b> บล็อกที่ต่อกันเป็นชุดจะทำงานจากบนลงล่างตามลำดับ และชุดคำสั่งจะเริ่มทำงานก็ต่อเมื่อมีบล็อกเหตุการณ์อยู่ด้านบนสุด ถ้าไม่มีบล็อกเหตุการณ์ คำสั่งจะไม่ทำงานเองอัตโนมัติ ต้องคลิกที่ชุดบล็อกนั้นเอง</p>
<div class="keybox"><b>ตัวอย่างการวาดรูปหลายเหลี่ยม</b>
<p>มุมรอบจุดหนึ่งรอบเท่ากับ 360 องศา ดังนั้นมุมที่ต้องหมุนคือ 360 หารด้วยจำนวนด้าน<br>
สี่เหลี่ยมจัตุรัส: ทำซ้ำ 4 ครั้ง เดินหน้า 100 ก้าว หมุน 90 องศา<br>
สามเหลี่ยมด้านเท่า: ทำซ้ำ 3 ครั้ง เดินหน้า 100 ก้าว หมุน 120 องศา</p></div>
<p><b>ข้อควรระวังและข้อจำกัด</b> ถ้าใส่คำสั่งเคลื่อนไหวหลายบล็อกติดกันโดยไม่มีบล็อก “รอ” ตัวละครจะเคลื่อนที่เร็วมากจนดูเหมือนกระโดดไปทันที เพราะคอมพิวเตอร์ทำงานเร็วกว่าที่ตาเรามองเห็น และแม้การเขียนแบบบล็อกจะเรียนง่าย แต่เมื่อโปรแกรมใหญ่และซับซ้อนขึ้น การจัดการจะยากกว่าภาษาแบบพิมพ์โค้ด</p>`,

lesson:`<p><b>การแก้จุดบกพร่อง (Debugging)</b> คือการหาและแก้ข้อผิดพลาดในโปรแกรม คำว่า Bug มีที่มาจริงจากปี ค.ศ. 1947 เมื่อทีมของ Grace Hopper พบผีเสื้อกลางคืนติดอยู่ในเครื่องคอมพิวเตอร์ Mark II จนทำให้เครื่องทำงานผิดพลาด</p>
<div class="keybox"><b>ข้อผิดพลาด 3 ประเภท</b>
<ul><li><b>ผิดไวยากรณ์ (Syntax Error)</b> — เขียนคำสั่งผิดรูปแบบ เช่น ลืมวงเล็บปิด สะกดคำสั่งผิด โปรแกรมจะรันไม่ได้เลยและมักบอกบรรทัดที่ผิดให้ จึงหาง่ายที่สุด</li>
<li><b>ผิดตอนทำงาน (Runtime Error)</b> — รันได้แต่พังกลางทาง เช่น หารด้วยศูนย์ เปิดไฟล์ที่ไม่มีอยู่ หรืออ้างถึงข้อมูลเกินขอบเขต</li>
<li><b>ผิดตรรกะ (Logic Error)</b> — รันได้ ไม่พัง แต่ผลลัพธ์ไม่ถูกต้อง เช่น ใช้สูตร กว้าง + ยาว แทน กว้าง × ยาว โปรแกรมไม่ฟ้องอะไรเลย จึงหายากที่สุด</li></ul></div>
<p><b>ขั้นตอนการแก้บั๊กอย่างเป็นระบบ 5 ขั้น</b></p>
<ul><li>1) <b>ทำซ้ำให้เจอปัญหา</b> — หาให้ได้ว่าทำอย่างไรบั๊กจึงเกิดทุกครั้ง เป็นขั้นแรกเสมอ</li>
<li>2) <b>จำกัดขอบเขต</b> — ตัดส่วนที่ไม่เกี่ยวออก จนเหลือส่วนที่ผิดจริง ๆ</li>
<li>3) <b>ตั้งสมมติฐาน</b> — คาดว่าผิดเพราะอะไร</li>
<li>4) <b>แก้ทีละจุด</b> — ห้ามแก้หลายจุดพร้อมกัน ไม่งั้นจะไม่รู้ว่าจุดใดคือตัวแก้ปัญหาจริง</li>
<li>5) <b>ทดสอบใหม่ทุกครั้ง</b> — รวมถึงทดสอบส่วนที่เคยทำงานได้ ว่าไม่พังตามไปด้วย</li></ul>
<p><b>เทคนิคที่ใช้ได้จริง</b> ให้โปรแกรมแสดงค่าตัวแปรออกมาเป็นระยะ แล้วดูว่าค่าเริ่มผิดเพี้ยนตรงจุดใด วิธีนี้ง่ายที่สุดและใช้ได้กับทุกภาษา อีกวิธีคือใส่ข้อมูลทดสอบที่รู้คำตอบอยู่แล้ว แล้วเทียบกับผลที่โปรแกรมให้ ถ้าต่างกันแปลว่ามีบั๊กแน่นอน</p>
<p><b>ข้อคิดสำคัญ</b> การเจอบั๊กไม่ใช่เรื่องน่าอาย โปรแกรมเมอร์มืออาชีพก็ใช้เวลาแก้บั๊กมากพอ ๆ กับเวลาเขียนโค้ด สิ่งที่ต่างกันคือเขามีวิธีค้นหาอย่างเป็นระบบ ไม่ใช่การเดาสุ่ม</p>`,

{n:13,t:"ข้อมูลและสารสนเทศ",ic:"💾",mon:{nm:"กองข้อมูลดิบ",ar:"🗄️"},
lesson:`<p><b>ข้อมูล (Data)</b> คือข้อเท็จจริงดิบ ๆ ที่ยังไม่ผ่านการประมวลผล อาจอยู่ในรูปตัวเลข ตัวอักษร ภาพ เสียง หรือวิดีโอ เช่น คะแนนสอบของนักเรียนทั้งห้อง 40 คน หรืออุณหภูมิรายวันตลอดปี 365 ค่า</p>
<p><b>สารสนเทศ (Information)</b> คือผลที่ได้จากการนำข้อมูลมาประมวลผลจนมีความหมายและใช้ตัดสินใจได้ เช่น คะแนนเฉลี่ยของห้อง กราฟเปรียบเทียบผลสอบระหว่างห้อง หรือข้อสรุปว่า “เดือนเมษายนมีอุณหภูมิเฉลี่ยสูงที่สุดของปี”</p>
<div class="keybox"><p style="text-align:center;font-size:17px"><b>ข้อมูล → ประมวลผล → สารสนเทศ → ใช้ตัดสินใจ</b></p>
<p>ตัวอย่างครบวงจร: อุณหภูมิรายวัน 365 ค่า (ข้อมูล) → หาค่าเฉลี่ยรายเดือน (ประมวลผล) → “เมษายนร้อนที่สุด” (สารสนเทศ) → จัดกิจกรรมกลางแจ้งในเดือนอื่นแทน (ตัดสินใจ)</p></div>
<p><b>คุณสมบัติของข้อมูลที่ดี 5 ข้อ</b></p>
<ul><li><b>ถูกต้อง</b> — ตรงกับความเป็นจริง ไม่พิมพ์ผิด ไม่บันทึกผิด</li>
<li><b>ครบถ้วน</b> — ไม่ขาดหายจนสรุปไม่ได้ เช่น เก็บคะแนนครบทุกคนแต่ลืมบันทึกว่าเป็นวิชาใด ถือว่าขาดความครบถ้วน</li>
<li><b>เป็นปัจจุบัน</b> — ทันสมัย เช่น ข้อมูลประชากรจากสำมะโนเมื่อ 30 ปีก่อนขาดคุณสมบัติข้อนี้</li>
<li><b>ตรงกับความต้องการ</b> — เกี่ยวข้องกับเรื่องที่กำลังจะตัดสินใจ ถ้าไม่ตรง ต่อให้ถูกต้องครบถ้วนก็ช่วยตัดสินใจไม่ได้</li>
<li><b>ตรวจสอบได้</b> — รู้ว่ามาจากไหน ย้อนกลับไปตรวจได้</li></ul>
<p><b>หลักสำคัญที่สุด</b> ถ้าข้อมูลนำเข้าผิด สารสนเทศที่ได้ก็ผิดตามไปด้วยเสมอ ไม่ว่าจะประมวลผลด้วยเครื่องมือดีแค่ไหน วงการคอมพิวเตอร์เรียกหลักนี้ว่า “ขยะเข้า ขยะออก” (Garbage In, Garbage Out) และระบบจะไม่แก้ไขให้เองโดยอัตโนมัติ</p>
<p><b>สรุปความต่าง</b> ข้อมูลคือข้อเท็จจริงดิบ ส่วนสารสนเทศคือผลที่ประมวลผลแล้วจนใช้ตัดสินใจได้ ไม่ได้ต่างกันที่เป็นตัวเลขหรือตัวอักษร และไม่ได้ต่างกันที่ปริมาณมากหรือน้อย</p>`,

{n:14,t:"การรวบรวมข้อมูล",ic:"📥",mon:{nm:"นักสำรวจจอมมั่ว",ar:"🕵️"},
lesson:`<p><b>การรวบรวมข้อมูล</b> คือขั้นตอนแรกสุดของการทำงานกับข้อมูล ถ้าเก็บมาผิดตั้งแต่ต้น ทุกขั้นตอนหลังจากนั้นจะผิดหมด ไม่ว่าจะประมวลผลเก่งแค่ไหน</p>
<div class="keybox"><b>แหล่งข้อมูล 2 ประเภท</b>
<ul><li><b>ปฐมภูมิ (Primary)</b> — เก็บเองโดยตรงจากแหล่งจริง เช่น สอบถาม สัมภาษณ์ สังเกต ทดลอง <b>ข้อดี</b> ได้ข้อมูลตรงตามที่ต้องการและเชื่อถือได้สูง <b>ข้อเสีย</b> ใช้เวลาและแรงงานมาก</li>
<li><b>ทุติยภูมิ (Secondary)</b> — ใช้ข้อมูลที่คนอื่นเก็บและเผยแพร่ไว้แล้ว เช่น หนังสือ เว็บไซต์ รายงานราชการ งานวิจัย <b>ข้อดี</b> ได้เร็วและประหยัด <b>ข้อเสีย</b> เราไม่ได้ควบคุมวิธีเก็บ จึงอาจไม่ถูกต้องหรือไม่ตรงวัตถุประสงค์ ต้องตรวจสอบความน่าเชื่อถือก่อนใช้เสมอ</li></ul></div>
<p><b>วิธีเก็บข้อมูล 4 วิธีและความเหมาะสม</b></p>
<ul><li><b>แบบสอบถาม</b> — เก็บจากคนจำนวนมากได้พร้อมกัน เช่น นักเรียนทั้งโรงเรียน 800 คน ประหยัดเวลา แต่ได้รายละเอียดตื้น และผู้ตอบอาจตอบไม่ตรงความจริง</li>
<li><b>การสัมภาษณ์</b> — ได้ข้อมูลลึกและซักถามต่อได้ เหมาะกับการหาเหตุผลเบื้องหลัง แต่ใช้เวลามาก ทำกับคนจำนวนมากไม่ไหว</li>
<li><b>การสังเกต</b> — ได้พฤติกรรมจริง ไม่ต้องพึ่งคำบอกเล่า แต่ไม่ทราบเหตุผลเบื้องหลังพฤติกรรมนั้น</li>
<li><b>การทดลอง</b> — ควบคุมตัวแปรได้ พิสูจน์เหตุและผลได้ เหมาะกับคำถามเช่น “ปุ๋ยสูตรใหม่ทำให้ต้นไม้โตเร็วกว่าจริงหรือไม่” แต่ต้องออกแบบอย่างรัดกุม</li></ul>
<p><b>สิ่งที่ต้องกำหนดก่อนลงมือเก็บ</b> ต้องตอบให้ได้ก่อนว่า จะเก็บข้อมูลอะไร เก็บจากใคร เก็บด้วยวิธีใด และจะนำไปใช้ตอบคำถามอะไร ถ้าข้ามขั้นนี้ มักได้ข้อมูลที่ใช้ตอบคำถามไม่ได้และต้องเสียเวลาเก็บใหม่ทั้งหมด</p>
<p><b>จริยธรรมในการเก็บข้อมูล</b> ต้องขออนุญาตผู้ให้ข้อมูลก่อน บอกวัตถุประสงค์ให้ชัดเจน ไม่แอบบันทึกเสียงหรือภาพโดยไม่ได้รับอนุญาต และไม่เปิดเผยข้อมูลส่วนตัวของผู้ตอบ</p>`,

{n:15,t:"การประมวลผลข้อมูล",ic:"⚙️",mon:{nm:"เครื่องจักรคำนวณ",ar:"🤖"},
lesson:`<p><b>การประมวลผลข้อมูล</b> คือการนำข้อมูลดิบมาจัดการด้วยวิธีต่าง ๆ จนกลายเป็นสารสนเทศที่ใช้งานได้ เป็นขั้นกลางของวงจร ข้อมูล → ประมวลผล → สารสนเทศ</p>
<div class="keybox"><b>ขั้นตอนหลัก 5 ขั้น</b>
<ul><li><b>ตรวจสอบและทำความสะอาดข้อมูล</b> — ตัดข้อมูลซ้ำ แก้ข้อมูลผิด จัดการข้อมูลที่ขาดหาย ขั้นนี้สำคัญที่สุดและมักถูกข้ามบ่อยที่สุด</li>
<li><b>จัดเรียง (Sorting)</b> — เรียงจากน้อยไปมากหรือมากไปน้อย ทำให้ค้นหาและเปรียบเทียบง่ายขึ้น</li>
<li><b>จัดกลุ่ม (Grouping)</b> — แยกตามประเภท เช่น แยกตามห้องเรียน แยกตามช่วงคะแนน</li>
<li><b>คำนวณ (Calculating)</b> — หาผลรวม ค่าเฉลี่ย ค่าสูงสุด ค่าต่ำสุด ร้อยละ</li>
<li><b>สรุปผล</b> — เรียบเรียงผลลัพธ์ให้อ่านเข้าใจและนำไปใช้ได้</li></ul></div>
<p><b>สูตรที่ใช้บ่อย</b></p>
<ul><li><b>ค่าเฉลี่ย</b> = ผลรวมทั้งหมด ÷ จำนวนข้อมูล<br>ตัวอย่าง 10, 20, 30 → 60 ÷ 3 = 20 · ตัวอย่าง 5, 8, 8, 15 → 36 ÷ 4 = 9 · ตัวอย่าง 4, 6, 8, 10 → 28 ÷ 4 = 7</li>
<li><b>ร้อยละ</b> = (ส่วนที่สนใจ ÷ ทั้งหมด) × 100<br>ตัวอย่าง ผ่าน 30 คนจาก 40 คน → (30 ÷ 40) × 100 = 75%</li>
<li><b>ค่าสูงสุดและต่ำสุด</b> คือค่ามากที่สุดและน้อยที่สุดในชุดข้อมูล เช่น 12, 15, 18, 15 มีค่าสูงสุด 18 และต่ำสุด 12</li></ul>
<div class="keybox"><b>ฝึกคิดร้อยละ — เอาส่วนที่สนใจหารด้วยทั้งหมด แล้วคูณ 100</b>
<ul><li>ผ่าน 30 จาก 40 คน → (30 ÷ 40) × 100 = <b>75%</b></li>
<li>ผ่าน 18 จาก 24 คน → (18 ÷ 24) × 100 = <b>75%</b></li>
<li>ผ่าน 27 จาก 36 คน → (27 ÷ 36) × 100 = <b>75%</b></li>
<li>ผ่าน 28 จาก 40 คน → (28 ÷ 40) × 100 = <b>70%</b></li></ul></div>
<p><b>ค่าที่ปรากฏบ่อยที่สุด (ฐานนิยม)</b> คือค่าที่พบซ้ำมากที่สุดในชุดข้อมูล เช่น 10, 20, 20, 30, 20 มีเลข 20 ปรากฏ 3 ครั้ง จึงเป็นค่าที่พบบ่อยที่สุด ค่านี้ต่างจากค่าเฉลี่ย และมีประโยชน์เมื่ออยากรู้ว่าคำตอบไหนถูกเลือกมากที่สุด เช่น เมนูอาหารที่นักเรียนสั่งบ่อยที่สุด</p>
<p><b>ผลของการทำความสะอาดข้อมูลต่อค่าเฉลี่ย</b> ถ้าลบข้อมูลซ้ำที่มีค่าต่ำออกไป ค่าเฉลี่ยจะสูงขึ้น แต่ถ้าลบข้อมูลซ้ำที่มีค่าสูงออกไป ค่าเฉลี่ยจะต่ำลง เช่น 5, 5, 10, 20 มีค่าเฉลี่ย 10 แต่พอลบเลข 5 ที่ซ้ำออกหนึ่งตัว เหลือ 5, 10, 20 ค่าเฉลี่ยกลายเป็น 11.67</p>
<p><b>วิธีประมวลผล 3 แบบ</b> ทำด้วยมือ (เหมาะกับข้อมูลน้อยมาก) ใช้เครื่องคิดเลข (ข้อมูลปานกลาง) และใช้คอมพิวเตอร์ (ข้อมูลจำนวนมาก) ข้อดีของคอมพิวเตอร์คือรวดเร็ว แม่นยำ และทำซ้ำได้ผลเหมือนเดิมทุกครั้งโดยไม่เหนื่อยล้าจนผิดพลาด</p>
<p><b>ข้อควรระวังสำคัญ</b> ถ้าลืมทำความสะอาดข้อมูลก่อนคำนวณ ผลลัพธ์จะคลาดเคลื่อนจากความจริงทันที เช่น ห้องหนึ่งมี 20 คน ค่าเฉลี่ย 60 คะแนน ถ้าบันทึกคนที่ได้ 100 คะแนนซ้ำอีกครั้ง ค่าเฉลี่ยที่คำนวณใหม่จะสูงกว่าความจริง ยิ่งข้อมูลมากยิ่งตรวจด้วยตาเปล่าไม่ไหว ต้องใช้เครื่องมือช่วย</p>`,

{n:16,t:"การนำเสนอข้อมูล",ic:"📊",mon:{nm:"กราฟบิดเบือน",ar:"📈"},
lesson:`<p><b>การนำเสนอข้อมูล</b> คือการเลือกรูปแบบที่ทำให้ผู้อ่านเข้าใจสารสนเทศได้เร็วและถูกต้องที่สุด รูปแบบที่เลือกผิดอาจทำให้ผู้อ่านตีความข้อมูลผิดไปจากความจริง แม้ข้อมูลจะถูกต้องทั้งหมดก็ตาม</p>
<div class="keybox"><b>เลือกแผนภูมิให้ตรงกับงาน</b>
<ul><li><b>แผนภูมิแท่ง</b> — เปรียบเทียบปริมาณระหว่างกลุ่มที่ไม่ต่อเนื่อง เช่น คะแนนเฉลี่ยของแต่ละห้อง</li>
<li><b>แผนภูมิเส้น</b> — แสดงการเปลี่ยนแปลงตามเวลาและเห็นแนวโน้ม เช่น อุณหภูมิรายเดือน ยอดขาย 12 เดือน</li>
<li><b>แผนภูมิวงกลม</b> — แสดงสัดส่วนของส่วนย่อยเทียบกับทั้งหมด ทุกส่วนรวมกันต้องได้ 100% พอดี ถ้าได้ 120% แสดงว่าข้อมูลผิดพลาด</li>
<li><b>แผนภูมิภาพ</b> — ใช้รูปแทนจำนวน เหมาะกับผู้อ่านทั่วไปหรือเด็กเล็ก</li>
<li><b>ตาราง</b> — เมื่อผู้อ่านต้องการตัวเลขที่แม่นยำ ไม่ใช่ภาพรวม</li></ul></div>
<p><b>องค์ประกอบที่กราฟที่ดีต้องมี</b> ชื่อกราฟที่บอกว่ากำลังแสดงอะไร ชื่อแกนพร้อมหน่วย แหล่งที่มาของข้อมูล และเมื่อมีข้อมูลหลายชุดต้องมีคำอธิบายสัญลักษณ์ (Legend) เพื่อให้รู้ว่าเส้นหรือแท่งใดคือข้อมูลชุดใด</p>
<div class="keybox"><b>การนำเสนอที่บิดเบือน — ต้องรู้เท่าทัน</b>
<ul><li>เริ่มแกนตั้งที่ 90 แทนที่จะเป็น 0 ทำให้ความต่างเพียงเล็กน้อยดูใหญ่เกินจริง</li>
<li>ใช้แผนภูมิ 3 มิติเอียง ๆ ทำให้ส่วนด้านหน้าดูใหญ่กว่าความเป็นจริง</li>
<li>เลือกแสดงเฉพาะช่วงเวลาที่ตรงกับข้อสรุปที่ตัวเองต้องการ ตัดช่วงที่ขัดแย้งทิ้ง</li>
<li>ใช้สัญลักษณ์ภาพที่ขยายทั้งความกว้างและความสูง ทำให้พื้นที่ดูใหญ่เกินสัดส่วนจริง</li></ul></div>
<p><b>ข้อควรจำ</b> เป้าหมายของการนำเสนอคือความเข้าใจที่ถูกต้อง ไม่ใช่ความสวยงาม สีสันมาก ภาพเคลื่อนไหว หรือแบบอักษรพิเศษไม่ได้ทำให้กราฟดีขึ้น ถ้าขาดชื่อกราฟและหน่วยของแกน</p>`,

{lv:3,q:"ต้องการเปรียบเทียบสัดส่วนการใช้เวลาของนักเรียน 2 คน ควรทำอย่างไร",c:["ใช้แผนภูมิวงกลม 2 วง วางเทียบกัน หรือใช้แผนภูมิแท่งแบบเทียบกลุ่ม","ใช้แผนภูมิเส้นวงเดียว","ใช้ตารางเปล่า","ใช้แผนภูมิ 3 มิติเอียง"],a:0},

{n:17,t:"โปรแกรมตารางคำนวณ",ic:"🧮",mon:{nm:"เซลล์ปริศนา",ar:"🟩"},
lesson:`<p><b>โปรแกรมตารางคำนวณ (Spreadsheet)</b> เช่น Microsoft Excel, Google Sheets หรือ LibreOffice Calc ช่วยจัดเก็บ คำนวณ จัดเรียง และสร้างกราฟจากข้อมูลจำนวนมากได้ในที่เดียว เป็นเครื่องมือประมวลผลข้อมูลที่ใช้กันแพร่หลายที่สุด</p>
<div class="keybox"><b>ศัพท์ที่ต้องรู้</b>
<ul><li><b>เซลล์ (Cell)</b> — ช่องเก็บข้อมูลหนึ่งช่อง อ้างอิงด้วยชื่อคอลัมน์ตามด้วยเลขแถว เช่น B3 หมายถึงคอลัมน์ B แถวที่ 3</li>
<li><b>คอลัมน์ (Column)</b> — แนวตั้ง ใช้ตัวอักษร A, B, C, ...</li>
<li><b>แถว (Row)</b> — แนวนอน ใช้ตัวเลข 1, 2, 3, ...</li>
<li><b>ช่วงเซลล์ (Range)</b> — กลุ่มเซลล์ต่อเนื่อง เขียนด้วยเครื่องหมายทวิภาค เช่น A1:A10 หมายถึงตั้งแต่ A1 ถึง A10 ทุกช่อง</li>
<li><b>สูตร (Formula)</b> — ต้องขึ้นต้นด้วยเครื่องหมาย <code>=</code> เสมอ ถ้าไม่ใส่ โปรแกรมจะมองว่าเป็นข้อความธรรมดาและไม่คำนวณให้</li></ul></div>
<p><b>ฟังก์ชันที่ใช้บ่อย</b></p>
<ul><li><code>=SUM(A1:A10)</code> — หาผลรวมของช่วงเซลล์</li>
<li><code>=AVERAGE(A1:A10)</code> — หาค่าเฉลี่ย</li>
<li><code>=MAX(A1:A10)</code> — หาค่าสูงสุด และ <code>=MIN(A1:A10)</code> — หาค่าต่ำสุด</li>
<li><code>=COUNT(A1:A10)</code> — นับจำนวนเซลล์ที่มีตัวเลข</li>
<li><code>=IF(A1&gt;=50,"ผ่าน","ไม่ผ่าน")</code> — ตรวจเงื่อนไขแล้วแสดงผลต่างกัน ถ้า A1 เป็น 50 พอดีจะได้ “ผ่าน” เพราะใช้มากกว่าหรือเท่ากับ</li></ul>
<div class="keybox"><b>ตัวอย่างการใช้กับข้อมูลนักเรียน 40 คน ที่คะแนนอยู่ในช่วง C2 ถึง C41</b>
<ul><li><code>=SUM(C2:C41)</code> ผลรวมคะแนนทั้งห้อง</li>
<li><code>=AVERAGE(C2:C41)</code> คะแนนเฉลี่ยของห้อง</li>
<li><code>=MAX(C2:C41)</code> คะแนนสูงสุด · <code>=MIN(C2:C41)</code> คะแนนต่ำสุด</li>
<li><code>=COUNT(C2:C41)</code> นับว่ามีกี่คนที่กรอกคะแนนแล้ว ช่องที่เว้นว่างจะไม่ถูกนับ</li>
<li><code>=IF(C2&gt;=80,“ดีมาก”,“ผ่าน”)</code> ถ้า C2 เป็น 80 ขึ้นไปจะได้ “ดีมาก” แต่ถ้าเป็น 79 จะได้ “ผ่าน” เพราะไม่ถึงเกณฑ์</li></ul></div>
<p><b>เมื่อแทรกหรือลบแถว</b> ถ้าแทรกแถวใหม่เข้าไป <u>กลางช่วง</u> ที่สูตรอ้างอิงอยู่ โปรแกรมส่วนใหญ่จะขยายช่วงให้เองและรวมแถวใหม่เข้าไปในการคำนวณด้วย แต่ถ้าลบแถวหรือคอลัมน์ที่สูตรอ้างอิงอยู่ สูตรจะเกิดข้อผิดพลาดทันที จึงควรตรวจสูตรทุกครั้งหลังจัดโครงสร้างตารางใหม่</p>
<p><b>จุดเด่นที่สำคัญที่สุด</b> สูตรอ้างอิง <u>ตำแหน่งเซลล์</u> ไม่ได้อ้างอิงตัวเลขโดยตรง เมื่อแก้ตัวเลขในเซลล์ต้นทาง ผลลัพธ์ของสูตรทุกช่องที่เกี่ยวข้องจะคำนวณใหม่ให้เองทันที ไม่ต้องพิมพ์สูตรซ้ำ นี่คือเหตุผลที่ควรเขียนสูตรอ้างอิงเซลล์แทนการพิมพ์ตัวเลขลงในสูตรตรง ๆ</p>
<p><b>ข้อควรระวัง</b> ถ้าลบแถวหรือคอลัมน์ที่สูตรอ้างอิงอยู่ สูตรจะเกิดข้อผิดพลาดทันที และถ้าพิมพ์ตัวเลขโดยมีช่องว่างหรือตัวอักษรปนอยู่ โปรแกรมจะถือว่าเป็นข้อความและนำไปคำนวณไม่ได้</p>`,

{n:18,t:"ใช้เทคโนโลยีอย่างปลอดภัย",ic:"🔐",mon:{nm:"แฮกเกอร์เงา",ar:"🥷"},
lesson:`<p>การใช้อินเทอร์เน็ตอย่างปลอดภัยเริ่มจากสองเรื่องหลัก คือการดูแล <b>รหัสผ่าน</b> และการปกป้อง <b>ข้อมูลส่วนตัว</b> ของตัวเอง</p>
<div class="keybox"><b>รหัสผ่านที่ดี</b>
<ul><li>ยาวอย่างน้อย 8 ตัวอักษร ยิ่งยาวยิ่งปลอดภัย</li>
<li>ผสมตัวพิมพ์ใหญ่ ตัวพิมพ์เล็ก ตัวเลข และสัญลักษณ์ เช่น Kx9#mT2p</li>
<li>ไม่ใช้วันเกิด ชื่อเล่น ชื่อสัตว์เลี้ยง หรือ 123456 เพราะเดาง่ายมาก</li>
<li>ไม่ใช้รหัสเดียวกันทุกเว็บไซต์ เพราะถ้าเว็บหนึ่งข้อมูลรั่ว บัญชีอื่นจะถูกเข้าถึงตามไปด้วยทั้งหมด</li>
<li>ไม่บอกใครเลย แม้แต่เพื่อนสนิท และไม่จดไว้ในที่ที่คนอื่นเห็น</li></ul></div>
<p><b>ภัยคุกคามที่พบบ่อย</b></p>
<ul><li><b>ฟิชชิ่ง (Phishing)</b> — หลอกให้กรอกข้อมูลผ่านเว็บหรือลิงก์ปลอมที่ทำเลียนแบบของจริง สังเกตได้จาก URL ที่สะกดเพี้ยนไปเล็กน้อยจากของจริง ข้อความเร่งให้รีบทำ และคำขู่ว่าบัญชีจะถูกปิด</li>
<li><b>มัลแวร์ (Malware)</b> — โปรแกรมมุ่งร้ายที่ทำอันตรายต่อเครื่องและข้อมูล มักมากับไฟล์แนบในอีเมล โปรแกรมเถื่อน หรือลิงก์ดาวน์โหลดจากแหล่งไม่รู้จัก</li>
<li><b>แรนซัมแวร์ (Ransomware)</b> — มัลแวร์ชนิดที่เข้ารหัสไฟล์ในเครื่องแล้วเรียกค่าไถ่ วิธีลดความเสียหายที่ดีที่สุดคือสำรองข้อมูลสำคัญไว้เป็นประจำ ไม่ใช่การจ่ายค่าไถ่</li>
<li><b>การขโมยข้อมูลผ่าน Wi-Fi สาธารณะ</b> — ไม่ควรทำธุรกรรมทางการเงินหรือกรอกรหัสผ่านขณะใช้ Wi-Fi ฟรีที่ไม่มีรหัส แต่การอ่านข่าวหรือดูแผนที่ทั่วไปทำได้</li></ul>
<p><b>ข้อมูลที่ไม่ควรโพสต์สาธารณะ</b> เลขบัตรประชาชน ที่อยู่บ้าน เบอร์โทรศัพท์ ตารางเรียนหรือเวลาที่อยู่บ้านคนเดียว เพราะทำให้ผู้ไม่หวังดีรู้ว่าเราอยู่ที่ไหนและว่างเวลาใด รวมถึงรูปที่มีป้ายทะเบียนรถ บอกตำแหน่งปัจจุบัน หรือรูปเอกสารราชการ</p>
<p><b>วิธีป้องกันพื้นฐาน</b> อัปเดตระบบปฏิบัติการและแอปเสมอ ติดตั้งโปรแกรมจากแหล่งทางการเท่านั้น สำรองข้อมูลสำคัญเป็นประจำ และเปิด <b>การยืนยันตัวตนสองขั้นตอน</b> ซึ่งช่วยให้แม้รหัสผ่านรั่ว ผู้อื่นก็ยังเข้าบัญชีไม่ได้เพราะต้องใช้รหัสยืนยันอีกชั้นหนึ่ง</p>`,

{n:19,t:"รู้เท่าทันสื่อและข่าวปลอม",ic:"📰",mon:{nm:"จอมปล่อยข่าวลวง",ar:"🗞️"},
lesson:`<p><b>ข่าวปลอม (Fake News)</b> คือข้อมูลเท็จหรือบิดเบือนที่ถูกเผยแพร่ให้ดูเหมือนข่าวจริง มักใช้พาดหัวที่กระตุ้นอารมณ์ให้โกรธ กลัว หรือตกใจ เพราะอารมณ์รุนแรงทำให้คนกดแชร์ทันทีโดยไม่ทันตรวจสอบ</p>
<div class="keybox"><b>ตรวจสอบ 4 ข้อก่อนแชร์</b>
<ul><li><b>ใคร</b> เป็นผู้เผยแพร่ มีตัวตนจริงและน่าเชื่อถือหรือไม่ ระบุชื่อผู้เขียนไหม</li>
<li><b>เมื่อไร</b> ข่าวนี้เผยแพร่วันไหน เป็นข่าวเก่าที่ถูกนำมาปล่อยซ้ำให้เข้าใจผิดหรือเปล่า</li>
<li><b>อ้างอิงอะไร</b> มีแหล่งที่มาที่ตรวจสอบย้อนกลับได้ไหม หรืออ้างแค่ “มีคนบอกว่า”</li>
<li><b>ที่อื่นว่าอย่างไร</b> สำนักข่าวหลักหลายแห่งรายงานตรงกันหรือไม่ นี่เป็นวิธีตรวจสอบที่ดีที่สุด</li></ul>
<p>สิ่งที่ <u>ใช้ตัดสินไม่ได้</u> คือจำนวนคนแชร์ จำนวนไลก์ หรือการที่เพื่อนสนิทส่งมาให้</p></div>
<p><b>สัญญาณอันตรายของข่าวปลอม</b></p>
<ul><li>พาดหัวใช้คำเกินจริง เช่น “ช็อกทั้งประเทศ” “ห้ามพลาดเด็ดขาด”</li>
<li>ไม่ระบุแหล่งที่มา ไม่มีชื่อผู้เขียน ไม่มีวันที่</li>
<li>สะกดผิดเยอะ ใช้ภาษาแปลก ๆ หรือจัดหน้าไม่เป็นระเบียบ</li>
<li>เร่งให้ “แชร์ด่วนก่อนถูกลบ” หรือ “ส่งต่อในกลุ่มไลน์ให้เร็วที่สุด”</li>
<li>ใช้ภาพจริงแต่บรรยายผิดเหตุการณ์ หรือนำภาพจากเหตุการณ์อื่นมาใช้ ซึ่งจัดเป็นข้อมูลบิดเบือน</li></ul>
<p><b>รู้เท่าทันสื่อ (Media Literacy)</b> หมายถึงความสามารถในการเข้าถึง วิเคราะห์ ประเมิน และสร้างสรรค์สื่ออย่างมีวิจารณญาณ ไม่ใช่แค่ใช้สื่อเป็นหรือใช้แอปได้คล่อง คำถามสำคัญที่สุดในการประเมินสื่อคือ <b>ใครสร้างสื่อนี้ สร้างเพื่ออะไร และใครได้ประโยชน์</b></p>
<p><b>ผลของการแชร์ข่าวปลอม</b> แม้แชร์ด้วยความหวังดี ก็อาจสร้างความตื่นตระหนก ทำลายชื่อเสียงผู้อื่น และผู้แชร์อาจมีความผิดตามพระราชบัญญัติว่าด้วยการกระทำความผิดเกี่ยวกับคอมพิวเตอร์ได้ด้วย ดังนั้นเมื่อได้รับข่าวที่ไม่มีแหล่งอ้างอิง สิ่งที่ควรทำคือไม่แชร์ต่อ แล้วค้นหาจากหน่วยงานที่เกี่ยวข้องหรือสำนักข่าวหลักก่อน</p>`,

{n:20,t:"ลิขสิทธิ์และจริยธรรมดิจิทัล",ic:"⚖️",mon:{nm:"ราชาผู้พิทักษ์ลิขสิทธิ์",ar:"👑"},
lesson:`<p><b>ลิขสิทธิ์ (Copyright)</b> คือสิทธิ์แต่เพียงผู้เดียวของผู้สร้างสรรค์ผลงาน ครอบคลุมงานเขียน รูปภาพ เพลง วิดีโอ ภาพยนตร์ และโปรแกรมคอมพิวเตอร์ ผลงานได้รับความคุ้มครองทันทีที่สร้างเสร็จ โดยไม่ต้องจดทะเบียนและไม่ต้องติดสัญลักษณ์ใด ๆ</p>
<div class="keybox"><b>ใช้ผลงานของผู้อื่นอย่างถูกต้อง</b>
<ul><li><b>ขออนุญาตเจ้าของก่อน</b> เป็นวิธีที่ปลอดภัยที่สุด</li>
<li><b>เลือกผลงานที่อนุญาตให้ใช้</b> เช่น สัญญาอนุญาตครีเอทีฟคอมมอนส์ (Creative Commons) ซึ่งเป็นสัญญาที่เจ้าของกำหนดเงื่อนไขให้ผู้อื่นนำผลงานไปใช้ได้ หรืองานที่หมดอายุความคุ้มครองแล้วซึ่งเรียกว่า <b>สาธารณสมบัติ</b></li>
<li><b>อ้างอิงแหล่งที่มาเสมอ</b> แม้ได้รับอนุญาตแล้วก็ต้องให้เครดิตผู้สร้าง</li>
<li><b>ใช้เพื่อการศึกษาอย่างพอสมควร</b> กฎหมายไทยอนุญาตให้ใช้บางส่วนเพื่อการเรียนการสอนได้ โดยต้องใช้พอสมควร ไม่กระทบต่อการหาประโยชน์ของเจ้าของ และต้องอ้างอิงที่มา</li></ul></div>
<p><b>การลอกเลียนผลงาน (Plagiarism)</b> คือการนำงานของผู้อื่นมาเสนอเป็นของตัวเอง ไม่ว่าจะคัดลอกทั้งหมดหรือบางส่วน ถือว่าผิดทั้งจริยธรรมและอาจผิดกฎหมาย การเปลี่ยนคำบางคำ เปลี่ยนสีภาพ หรือครอบตัดลายน้ำออก ก็ยังถือว่าเป็นการลอกเลียนอยู่ดี</p>
<p><b>จริยธรรมในโลกออนไลน์</b></p>
<ul><li>ไม่กลั่นแกล้งผู้อื่นทางออนไลน์ (Cyberbullying) ไม่ว่าจะด้วยข้อความ ภาพ หรือการตั้งกลุ่มเพื่อรุมว่า</li>
<li>ไม่เผยแพร่ภาพหรือข้อมูลของผู้อื่นโดยไม่ได้รับอนุญาต</li>
<li>ไม่เข้าถึงบัญชีหรือข้อมูลของผู้อื่นโดยไม่มีสิทธิ์ แม้จะรู้รหัสผ่านโดยบังเอิญและไม่ได้แก้ไขอะไรเลยก็ตาม ก็ยังผิดจริยธรรมและอาจผิดกฎหมาย</li>
<li>รับผิดชอบต่อสิ่งที่ตนเองโพสต์ เพราะร่องรอยดิจิทัลลบได้ยากและอาจติดตัวไปนาน</li></ul>
<p><b>ข้อควรจำที่สุด</b> การที่ไฟล์อยู่บนอินเทอร์เน็ตและดาวน์โหลดได้ฟรี ไม่ได้แปลว่าไม่มีลิขสิทธิ์ ต้องดูเงื่อนไขการใช้งานเสมอ วิธีที่ปลอดภัยที่สุดสำหรับงานนักเรียนคือถ่ายภาพเองหรือใช้ภาพสัญญาอนุญาตครีเอทีฟคอมมอนส์พร้อมอ้างอิงแหล่งที่มา</p>`,

      try{
        const AC = await import(SDK+"firebase-app-check.js");

          provider:new AC.ReCaptchaV3Provider(RECAPTCHA_SITE_KEY),
          isTokenAutoRefreshEnabled:true
        });

}

/* เข้ารหัสรหัสผ่านด้วย SHA-256 (ปลอดภัยกว่าเดิม แต่ยังไม่ควรใช้รหัสผ่านจริงของนักเรียน) */
const SALT="code-arena-2569::";
async function sha(txt){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+txt));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

function rankOf(rp,pos){
  rp = Number(rp); if(!isFinite(rp)||rp<0) rp = 0;
  if(rp>=CFG.godMinRp && pos && pos<=CFG.godTop)
    return {t:7,nm:"เทพคอม",div:0,c:TIERS[7].c,full:"เทพคอม"};
  if(rp>=3001) return {t:6,nm:"ซูพรีม",div:0,c:TIERS[6].c,full:"ซูพรีม"};
  const k = rp<=100 ? 0 : Math.ceil(rp/100)-1;
  const t = Math.min(5, Math.floor(k/5));
  return {t,nm:TIERS[t].nm,div:5-(k%5),c:TIERS[t].c,full:TIERS[t].nm+" "+(5-(k%5))};
}
/* บรอนซ์–ตำนาน ชนะได้มากกว่าที่แพ้เสีย · ซูพรีมขึ้นไปกลับด้าน
   และยิ่งแต้มสูง อัตรา "แพ้ 1 ตา = ต้องชนะกี่ตา" ยิ่งถ่างขึ้นตามที่กำหนดไว้
   3500→3, 4000→5, 5000→6, 7000→7, 8000→8, 8500→9, 9000→10          */
const RP_WIN =[[0,60],[1000,50],[2000,40],[3000,30],[3001,20],[3500,10],[4000,6],[5000,5],[9000,5]];
const RP_LOSS=[[0,14],[1000,18],[2000,22],[3000,26],[3500,30],[5000,30],[7000,35],[8000,40],[8500,45],[9000,50]];
function interp(tbl,x){
  if(x<=tbl[0][0])return tbl[0][1];
  for(let i=1;i<tbl.length;i++){
    if(x<=tbl[i][0]){const a=tbl[i-1],b=tbl[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}
  }
  return tbl[tbl.length-1][1];
}
function winRp(rp){return Math.max(3,Math.round(interp(RP_WIN,rp)))}
function loseRp(rp){return -Math.round(interp(RP_LOSS,rp))}
function ratioAt(rp){return (-loseRp(rp)/winRp(rp))}
function pvpHp(t){return t>=CFG.hpUpFromTier?CFG.pvpHpHigh:CFG.pvpHpLow}
function clearedCount(u){return Object.keys(u.clear||{}).length}

const $=id=>document.getElementById(id);
let AUTHMODE="login";                       // login | signup | forgot
function setAuthMode(m){
  AUTHMODE=m;
  const T={login:["เข้าสู่ระบบ","เข้าสู่ระบบ"],
           signup:["สมัครสมาชิก","สมัครและเริ่มเล่น"],
           forgot:["ขอเปลี่ยนรหัสผ่าน","ส่งคำขอให้ครูอนุมัติ"]}[m];
  $("authTitle").textContent=T[0];
  $("authGo").textContent=T[1];
  $("switchText").textContent=m==="signup"?"มีบัญชีแล้ว?":"ยังไม่มีบัญชี?";
  $("switchBtn").textContent=m==="signup"?"เข้าสู่ระบบ":"สมัครสมาชิก";
  $("passLabel").textContent=m==="forgot"?"รหัสผ่านใหม่ที่ต้องการ":"รหัสผ่าน";
  $("nameRow").classList.toggle("hide",m!=="signup");
  $("confirmRow").classList.toggle("hide",m!=="forgot");
  $("forgotBtn").textContent = m==="forgot" ? "← กลับไปหน้าเข้าสู่ระบบ" : "ลืมรหัสผ่าน?";
  $("switchBtn").parentElement.classList.toggle("hide",m==="forgot");
  $("authMsg").textContent="";$("authMsg").classList.remove("ok");
  if(m==="forgot"){
    $("authMsg").classList.add("ok");
    $("authMsg").textContent="กรอกชื่อผู้ใช้และรหัสผ่านใหม่ แล้วรอครูอนุมัติ";
  }
}
$("switchBtn").onclick=()=>setAuthMode(AUTHMODE==="signup"?"login":"signup");
$("forgotBtn").onclick=()=>setAuthMode(AUTHMODE==="forgot"?"login":"forgot");
$("authGo").onclick=doAuth;
$("upass").onkeydown=e=>{if(e.key==="Enter")doAuth()};
$("uname").onkeydown=e=>{if(e.key==="Enter")$("upass").focus()};

async function doAuth(){
  const n=$("uname").value.trim().toLowerCase(), p=$("upass").value, m=$("authMsg");
  m.classList.remove("ok");
  if(!/^[a-z0-9._-]{3,24}$/.test(n)) return m.textContent="ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - ยาว 3–24 ตัว";
  if(p.length<4) return m.textContent="รหัสผ่านต้องยาวอย่างน้อย 4 ตัวอักษร";
  const btn=$("authGo"), old=btn.textContent;
  btn.disabled=true; btn.textContent="กำลังดำเนินการ...";
  try{
    const pw=await sha(p);
    if(AUTHMODE==="forgot"){
      if(!await DAL.getUser(n)) return m.textContent="ไม่พบชื่อผู้ใช้นี้";
      if($("upass2").value!==p) return m.textContent="รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน";
      await DAL.putReset(n,pw);
      m.classList.add("ok");
      m.textContent="ส่งคำขอแล้ว แจ้งครูให้กดอนุมัติ แล้วจึงเข้าสู่ระบบด้วยรหัสใหม่ได้";
      $("upass").value="";$("upass2").value="";
      return;
    }
    if(AUTHMODE==="signup"){
      const ok=await DAL.createUser(n,Object.assign(blankUser($("ureal").value.trim()),{pw}));
      if(!ok) return m.textContent="ชื่อผู้ใช้นี้ถูกใช้แล้ว ลองเติมเลขที่ต่อท้าย";
      U=await DAL.getUser(n);
    }else{
      const u=await DAL.getUser(n);
      if(!u) return m.textContent="ไม่พบชื่อผู้ใช้นี้ กดสมัครสมาชิกก่อน";
      if(u.pw!==pw) return m.textContent="รหัสผ่านไม่ถูกต้อง (ถ้าเพิ่งขอเปลี่ยน ต้องรอครูอนุมัติก่อน)";
      U=u;
    }
    ME=n; sessionStorage.setItem(SESS,n);
    await afterLogin();
  }catch(e){
    m.textContent="เกิดข้อผิดพลาดในการเชื่อมต่อ ลองใหม่อีกครั้ง";
    console.error(e);
  }finally{ btn.disabled=false; btn.textContent=old; }
}

  await loadSeason();
  await refreshPos();
  $("authView").classList.add("hide");$("app").classList.remove("hide");
  refreshTop(); go("map");
}

    ${done>=CFG.unlockPvpAfter?"สนามประลองเปิดให้เข้าแล้ว":`ผ่านอีก ${CFG.unlockPvpAfter-done} ด่าน จะเปิดสนามประลอง`}</p></div>

let TICK=null;
const HIDE_TXT={never:"เห็นท่ามอนสเตอร์ตลอด",half:"มอนสเตอร์ปิดไพ่เมื่อเลือดเหลือไม่ถึงครึ่ง",always:"มอนสเตอร์ปิดไพ่ตั้งแต่ต้น"};
let READ=null;                               // สถานะการอ่านของด่านที่เปิดอยู่

/* เวลาอ่านขั้นต่ำคิดจากความยาวใบความรู้ อยู่ระหว่าง 15–45 วินาที */
function readSeconds(st){
  const chars=st.lesson.replace(/<[^>]+>/g,"").length;
  return Math.min(CFG.readMax, Math.max(CFG.readMin, Math.round(chars/50)));
}
function hasRead(n){ return !!(U.read&&U.read[n]) || Object.keys(U.clear[n]||{}).length>0 }

function openStage(n){
  const st=STAGES.find(x=>x.n===n), c=U.clear[n]||{};
  U.read=U.read||{};
  const done=hasRead(n);
  const rec=U.read[n];
  $("viewLesson").innerHTML=`
    <button class="ghost" onclick="go('map')" style="margin-bottom:14px">← กลับแผนที่</button>
    ${done?`<div class="panel" style="border-color:var(--hp);margin-bottom:16px">
        <b style="color:var(--hp)">✓ ผ่านการตรวจการอ่านของด่านนี้แล้ว</b>
        <p class="note" style="margin-top:4px">${rec?`อ่านเมื่อ ${new Date(rec.at).toLocaleString("th-TH")} · ใช้เวลา ${rec.sec} วินาที`:"ผ่านด่านนี้มาแล้ว"} — เลือกระดับด้านล่างได้เลย จะอ่านทบทวนอีกรอบก็ได้</p>
      </div>`
      :`<div class="readbar" id="readBar">
        <div class="lab"><span>อ่านใบความรู้ให้ครบก่อนเข้าด่าน</span><span id="readPct">0%</span></div>
        <div class="track"><i id="readFill" style="width:0%"></i></div>
        <div class="lab" style="margin:6px 0 0"><span id="readHint">เลื่อนอ่านลงไปจนสุดหน้า</span><span id="readTime"></span></div>
      </div>`}
    <div class="panel lesson" id="lessonBox">
      <span class="tag">ด่าน ${n}</span>
      <h2 style="margin-top:10px">${st.ic} ${st.t}</h2>
      ${st.lesson}
    </div>
    <div id="gateBox" style="margin-top:16px"></div>`;
  go("lesson");
  if(done) return showDiffs(n);
  READ={n,need:readSeconds(st),sec:0,scroll:0,tries:0};
  $("gateBox").innerHTML=`<div class="panel"><p class="note">อ่านให้ครบแล้วจะมีแบบตรวจการอ่าน 2 ข้อ ตอบถูกทั้งสองข้อจึงเข้าด่านได้ · ตอบผิดไม่มีบทลงโทษ อ่านทบทวนแล้วลองใหม่ได้ไม่จำกัด</p></div>`;
  READ_H=()=>updateRead();
  window.addEventListener("scroll",READ_H,{passive:true});
  updateRead();
  TICK=setInterval(()=>{READ.sec++;updateRead()},1000);
}
let READ_H=null;
function stopRead(){ if(READ_H){window.removeEventListener("scroll",READ_H);READ_H=null} }

function updateRead(){
  if(!READ)return;
  const box=$("lessonBox"); if(!box)return;
  const r=box.getBoundingClientRect();
  const seen=Math.min(1,Math.max(0,(window.innerHeight-r.top)/Math.max(1,r.height)));
  READ.scroll=Math.max(READ.scroll,seen);
  const timePart=Math.min(1,READ.sec/READ.need);
  const pct=Math.round((READ.scroll*0.6+timePart*0.4)*100);
  const f=$("readFill"), p=$("readPct"), h=$("readHint"), t=$("readTime");
  if(f)f.style.width=pct+"%";
  if(p)p.textContent=pct+"%";
  if(t)t.textContent=READ.sec<READ.need?`เหลืออีก ${READ.need-READ.sec} วินาที`:"ครบเวลาแล้ว";
  const ok=READ.scroll>=0.98 && READ.sec>=READ.need;
  if(h)h.textContent = ok?"พร้อมทำแบบตรวจการอ่านแล้ว"
      : READ.scroll<0.98 ? "เลื่อนอ่านลงไปจนสุดหน้า" : "อ่านครบแล้ว รออีกนิด";
  if(ok && !READ.ready){ READ.ready=true; clearInterval(TICK); openCheck(); }
}

/* ---------- แบบตรวจการอ่าน 2 ข้อ ---------- */
function openCheck(){
  const st=STAGES.find(x=>x.n===READ.n);
  const pool=st.q.filter(q=>q.lv===1);
  READ.qs=shuffle(pool.slice()).slice(0,2).map(q=>({q,order:shuffle(q.c.map((t,i)=>({t,i}))),pick:null}));
  drawCheck();
  $("gateBox").scrollIntoView({behavior:"smooth",block:"start"});
}
function drawCheck(msg){
  $("gateBox").innerHTML=`
    <div class="panel">
      <h3>แบบตรวจการอ่าน</h3>
      <p class="note" style="margin:6px 0 14px">ตอบให้ถูกทั้ง 2 ข้อเพื่อเข้าด่าน ${READ.tries?`· พยายามครั้งที่ ${READ.tries+1}`:""}</p>
      ${READ.qs.map((it,qi)=>`<div class="checkq">
        <div class="qq">${qi+1}. ${it.q.q}</div>
        <div class="opts">${it.order.map((o,k)=>
          `<button class="opt ${it.pick===o.i?"pick":""}" onclick="pickCheck(${qi},${o.i})">${"กขคง"[k]}. ${o.t}</button>`).join("")}</div>
      </div>`).join("")}
      <div class="msg ${msg&&msg.ok?"ok":""}" id="checkMsg">${msg?msg.text:""}</div>
      <button class="primary wide" onclick="submitCheck()">ตรวจคำตอบ</button>
    </div>`;
}
function pickCheck(qi,i){ READ.qs[qi].pick=i; drawCheck(); }
async function submitCheck(){
  if(READ.qs.some(x=>x.pick===null))
    return drawCheck({text:"ยังตอบไม่ครบทั้ง 2 ข้อ"});
  const wrong=READ.qs.filter(x=>x.pick!==x.q.a);
  READ.tries++;
  if(wrong.length){
    const st=STAGES.find(x=>x.n===READ.n);
    const pool=st.q.filter(q=>q.lv===1);
    READ.qs=shuffle(pool.slice()).slice(0,2).map(q=>({q,order:shuffle(q.c.map((t,i)=>({t,i}))),pick:null}));
    drawCheck({text:`ยังไม่ถูก ${wrong.length} ข้อ — เลื่อนขึ้นไปอ่านทบทวนแล้วลองใหม่ได้เลย (เปลี่ยนเป็นคำถามชุดใหม่ให้แล้ว)`});
    return;
  }
  U.read=U.read||{};
  U.read[READ.n]={at:Date.now(),sec:READ.sec,tries:READ.tries};
  await commit();
  stopRead();
  const n=READ.n;READ=null;
  showDiffs(n,true);
}

/* =======================================================================
   ส่วนที่ 8 : ระบบต่อสู้
   ทั้งสองฝั่งลงมือพร้อมกัน ท่าของใครจะทำงานก็ต่อเมื่อฝ่ายนั้น "ตอบถูก"
   ถ้าถูกทั้งคู่และเลือกโจมตีทั้งคู่ ก็เสียเลือดทั้งคู่
